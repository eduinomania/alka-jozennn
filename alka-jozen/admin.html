<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OWNER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI;
background:
linear-gradient(
135deg,
#0f4c75 0%,
#3282b8 25%,
#bbe1fa 50%,
#3282b8 75%,
#0f4c75 100%
);
background-size:400% 400%;
animation:waterFlow 20s ease infinite;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}

@keyframes waterFlow{
0%{background-position:0% 50%;}
25%{background-position:100% 50%;}
50%{background-position:100% 0%;}
75%{background-position:0% 0%;}
100%{background-position:0% 50%;}
}

/* BUBBLES */

.bubble{
position:fixed;
border-radius:50%;
background:linear-gradient(
135deg,
rgba(187,225,250,0.3),
rgba(50,130,184,0.2)
);
backdrop-filter:blur(15px);
border:2px solid rgba(187,225,250,0.4);
animation:waterDrop 15s infinite ease-in-out;
z-index:0;
}

@keyframes waterDrop{
0%{
transform:translateY(0) scale(1);
opacity:.7;
}
50%{
transform:translateY(-40px) scale(1.1);
opacity:1;
}
100%{
transform:translateY(0) scale(1);
opacity:.7;
}
}

/* SIDEBAR */

.sidebar{
width:260px;
height:100vh;
position:fixed;
padding:20px;
background:rgba(15,76,117,0.9);
backdrop-filter:blur(25px);
border-right:1px solid rgba(255,255,255,0.2);
z-index:10;
}

.brand{
font-size:24px;
font-weight:bold;
color:#bbe1fa;
text-align:center;
margin-bottom:30px;
}

.sidebar button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:16px;
background:rgba(255,255,255,0.08);
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
text-align:left;
}

.sidebar button:hover{
background:rgba(255,255,255,0.18);
transform:translateX(5px);
}

.sidebar button.logout-btn{
margin-top:auto;
background:rgba(239,68,68,0.3);
border:1px solid rgba(239,68,68,0.5);
}

.sidebar button.logout-btn:hover{
background:rgba(239,68,68,0.5);
}

/* MAIN */

.main{
margin-left:260px;
padding:30px;
width:100%;
position:relative;
z-index:1;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.topbar h1{
font-size:32px;
color:#bbe1fa;
}

.clock{
padding:14px 20px;
border-radius:16px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:22px;
padding:25px;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 30px rgba(0,0,0,0.2);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* STAT */

.stat{
text-align:center;
}

.stat h2{
font-size:40px;
color:#bbe1fa;
}

.stat p{
margin-top:10px;
color:#dbeafe;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:16px;
}

th,td{
padding:16px;
text-align:left;
}

th{
background:rgba(15,76,117,0.5);
color:#bbe1fa;
}

tr{
background:rgba(255,255,255,0.05);
}

tr:hover{
background:rgba(255,255,255,0.1);
}

/* STATUS */

.status{
padding:8px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.pending{
background:#f59e0b;
}

.delivered{
background:#22c55e;
}

.ontime{
background:#3b82f6;
}

/* NOTIFY */

.notify{
padding:18px;
margin:12px 0;
border-radius:14px;
background:rgba(255,255,255,0.08);
}

/* BUTTON */

.btn{
padding:12px 20px;
border:none;
border-radius:14px;
background:#3b82f6;
color:white;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* RESPONSIVE */

@media(max-width:768px){

body{
flex-direction:column;
}

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
}

}

/* CALENDAR */

.calendar{
width:100%;
}

.calendar-header{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-bottom:10px;
}

.calendar-header div{
background:rgba(255,255,255,0.08);
padding:12px;
text-align:center;
border-radius:12px;
font-weight:bold;
color:#bbe1fa;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
}

.day{
height:90px;
border-radius:16px;
padding:10px;
display:flex;
flex-direction:column;
justify-content:space-between;
font-weight:bold;
transition:.3s;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.day:hover{
transform:translateY(-3px);
background:rgba(255,255,255,0.1);
}

.day span{
font-weight:bold;
font-size:18px;
}

.day small{
font-size:11px;
margin-top:8px;
}

.attended{
border:2px solid #22c55e;
}

.late{
border:2px solid #f59e0b;
}

.empty{
background:transparent;
border:none;
}

/* ================= CALENDAR ================= */

.calendar-controls{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.calendar-controls h2{
font-size:32px;
font-weight:bold;
color:white;
}

.calendar-btn{
width:55px;
height:55px;
border:none;
border-radius:18px;
background:#3b82f6;
color:white;
font-size:22px;
cursor:pointer;
transition:.3s;
}

.calendar-btn:hover{
transform:scale(1.08);
background:#2563eb;
}

/* DAYS HEADER */

.calendar-header{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-bottom:15px;
}

.calendar-header div{
text-align:center;
font-weight:bold;
padding:10px;
font-size:20px;
color:white;
}

/* GRID */

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
}

/* DAY BOX */

.day{
height:120px;
border-radius:20px;
padding:15px;
display:flex;
flex-direction:column;
justify-content:space-between;
font-weight:bold;
transition:.3s;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.day:hover{
transform:translateY(-5px);
}

/* COLORS */

.presentDay{
background:#22c55e;
}

.lateDay{
background:#f59e0b;
}

.absentDay{
background:#ef4444;
}

.empty{
background:transparent;
box-shadow:none;
}

/* TEXT */

.day-number{
font-size:28px;
}

.time{
font-size:10px;
opacity:.95;
line-height:1.3;
}

.status-label{
font-size:10px;
padding:4px 8px;
border-radius:10px;
background:rgba(255,255,255,0.2);
width:fit-content;
}

/* RESPONSIVE */

@media(max-width:768px){

.calendar-grid{
grid-template-columns:repeat(2,1fr);
}

.calendar-header{
display:none;
}

.day{
height:110px;
}

}

.rider-card{
cursor:pointer;
transition:.3s;
}

.rider-card:hover{
transform:translateY(-5px) scale(1.02);
background:rgba(255,255,255,0.15);
}

/* ================= LOGIN OVERLAYS ================= */

.login-overlay {
position: fixed;
inset: 0;
background: linear-gradient(135deg, #0f4c75 0%, #3282b8 25%, #bbe1fa 50%, #3282b8 75%, #0f4c75 100%);
background-size: 400% 400%;
animation: waterFlow 20s ease infinite;
display: flex;
align-items: center;
justify-content: center;
z-index: 2000;
}

/* ================= ADMIN LOGIN ================= */

.admin-login-overlay {
position: fixed;
inset: 0;
background: rgba(8, 47, 73, 0.72);
backdrop-filter: blur(12px);
display: flex;
align-items: center;
justify-content: center;
z-index: 2000;
}

.admin-login-box {
width: min(420px, calc(100% - 40px));
background: rgba(255,255,255,0.96);
border-radius: 24px;
padding: 28px;
box-shadow: 0 24px 60px rgba(2, 44, 71, 0.25);
text-align: center;
}

.admin-login-box h2 {
color: #0f172a;
margin-bottom: 8px;
}

.admin-login-box p {
color: #475569;
margin-bottom: 20px;
}

.admin-login-box input {
width: 100%;
margin-bottom: 12px;
padding: 12px 14px;
border-radius: 12px;
border: 1px solid #bae6fd;
font-size: 15px;
}

.admin-login-box button {
width: 100%;
margin-top: 4px;
}

/* ================= CUSTOMER LOGIN ================= */

.customer-login-container {
display: none;
}

.customer-login-container.active {
display: flex;
}

.login-wrapper {
display: flex;
width: 100%;
height: 100vh;
}

.login-left {
width: 45%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px;
background: rgba(15, 76, 117, 0.95);
backdrop-filter: blur(25px);
}

.login-brand {
text-align: center;
margin-bottom: 60px;
}

.water-icon {
width: 80px;
height: 80px;
background: rgba(187, 225, 250, 0.3);
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
margin: 0 auto 20px;
font-size: 50px;
}

.login-brand h1 {
font-size: 32px;
color: #bbe1fa;
margin: 0;
font-weight: bold;
}

.login-brand p {
font-size: 14px;
color: #a0d8ff;
margin-top: 5px;
}

.nav-buttons {
display: flex;
flex-direction: column;
gap: 12px;
width: 100%;
max-width: 300px;
margin-top: 40px;
}

.nav-btn {
padding: 14px 20px;
border: none;
border-radius: 12px;
background: rgba(255, 255, 255, 0.08);
color: white;
cursor: pointer;
font-size: 15px;
font-weight: 500;
transition: 0.3s;
text-align: center;
}

.nav-btn:hover {
background: rgba(255, 255, 255, 0.18);
}

.nav-btn.active {
background: rgba(187, 225, 250, 0.2);
border: 1px solid rgba(187, 225, 250, 0.4);
}

.nav-arrow {
position: absolute;
bottom: 40px;
right: 40px;
width: 50px;
height: 50px;
background: rgba(255, 255, 255, 0.1);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 20px;
transition: 0.3s;
}

.nav-arrow:hover {
background: rgba(255, 255, 255, 0.2);
transform: translateX(5px);
}

.login-right {
width: 55%;
display: flex;
align-items: center;
justify-content: center;
padding: 40px;
}

.login-form-container {
background: rgba(255, 255, 255, 0.95);
border-radius: 24px;
padding: 40px;
box-shadow: 0 24px 60px rgba(2, 44, 71, 0.25);
width: 100%;
max-width: 400px;
}

.login-form-container h2 {
color: #0f172a;
font-size: 24px;
margin-bottom: 8px;
}

.login-form-container p {
color: #64748b;
font-size: 14px;
margin-bottom: 28px;
}

.form-group {
margin-bottom: 16px;
}

.form-group label {
display: flex;
align-items: center;
color: #475569;
font-size: 13px;
margin-bottom: 6px;
}

.form-group label i {
margin-right: 6px;
font-size: 16px;
}

.form-group input {
width: 100%;
padding: 12px 14px;
border: 1px solid #bae6fd;
border-radius: 10px;
font-size: 15px;
transition: 0.3s;
}

.form-group input:focus {
outline: none;
border-color: #3b82f6;
box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.login-btn {
width: 100%;
padding: 12px;
background: #3b82f6;
color: white;
border: none;
border-radius: 10px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
margin-top: 10px;
transition: 0.3s;
}

.login-btn:hover {
background: #2563eb;
transform: translateY(-2px);
}

.login-links {
text-align: center;
margin-top: 20px;
font-size: 13px;
}

.login-links a {
color: #3b82f6;
text-decoration: none;
margin: 0 5px;
}

.login-links a:hover {
text-decoration: underline;
}

.close-login-btn {
position: absolute;
top: 20px;
right: 20px;
background: rgba(255, 255, 255, 0.1);
border: none;
color: white;
width: 40px;
height: 40px;
border-radius: 50%;
cursor: pointer;
font-size: 24px;
z-index: 2001;
}

.close-login-btn:hover {
background: rgba(255, 255, 255, 0.2);
}

/* RESPONSIVE */

@media(max-width:1024px){

.login-wrapper {
flex-direction: column;
height: auto;
}

.login-left {
width: 100%;
padding: 30px 20px;
}

.login-right {
width: 100%;
padding: 20px;
}

.login-form-container {
max-width: 100%;
}

}

</style>
</head>

<body>

<!-- ADMIN LOGIN OVERLAY -->
<div id="adminLoginOverlay" class="admin-login-overlay">
  <div class="admin-login-box">
    <h2>Admin Access Portal</h2>
    <p>Use your admin credentials to enter the dashboard.</p>
    <input id="adminLoginUsername" type="text" placeholder="Admin Username">
    <input id="adminLoginPassword" type="password" placeholder="Password">
    <button class="btn" onclick="adminLogin()">Enter Dashboard</button>
  </div>
</div>

<!-- CUSTOMER LOGIN OVERLAY -->
<div id="customerLoginOverlay" class="login-overlay customer-login-container">
  <button class="close-login-btn" onclick="closeCustomerLogin()">✕</button>
  
  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-brand">
        <div class="water-icon">💧</div>
        <h1>Alka-Jozen</h1>
        <p>Pure Water Delivery</p>
      </div>
      
      <div class="nav-buttons">
        <button class="nav-btn active" onclick="switchLoginTab('login')">🔐 Login</button>
        <button class="nav-btn" onclick="switchLoginTab('register')">📝 Register</button>
        <button class="nav-btn" onclick="switchLoginTab('reset')">🔑 Reset</button>
      </div>
      
      <div class="nav-arrow" onclick="toggleLoginPanel()">›</div>
    </div>
    
    <div class="login-right">
      <div class="login-form-container">
        <h2>Hello Customer!</h2>
        <p>Login to continue</p>
        
        <div class="form-group">
          <label><i>👤</i> Username</label>
          <input id="customerUsername" type="text" placeholder="Enter your username">
        </div>
        
        <div class="form-group">
          <label><i>🔒</i> Password</label>
          <input id="customerPassword" type="password" placeholder="Enter your password">
        </div>
        
        <button class="login-btn" onclick="customerLogin()">Login</button>
        
        <div class="login-links">
          <a href="#">Forgot Password?</a> | <a href="#">Register</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none;">

<div class="brand">
💧 OWNER DASHBOARD
</div>

<button onclick="salesReport()">📊 Sales Report</button>

<button onclick="managerPerformance()">👨‍💼 Manager Performance</button>

<button onclick="riderPerformance()">🏍️ Rider Performance</button>

<button onclick="inventoryFilter()">🧪 Inventory & Filter</button>

<button class="logout-btn" onclick="logout()" style="margin-top:auto;">🚪 Logout</button>

</div>

<!-- MAIN -->

<div class="main" id="main" style="display:none;">

<div class="topbar">

<h1>Owner Monitoring System</h1>

<div class="clock" id="clock"></div>

</div>

<div id="content"></div>

</div>

<script>

/* ================= LOGIN MANAGEMENT ================= */

function adminLogin() {
const enteredUser = document.getElementById("adminLoginUsername").value.trim();
const enteredPass = document.getElementById("adminLoginPassword").value.trim();

if (!enteredUser || !enteredPass) {
  alert("Please enter both the username and password.");
  return;
}

if (enteredUser === "admin" && enteredPass === "admin123") {
  localStorage.setItem("adminLoggedIn", "true");
  localStorage.setItem("userType", "admin");
  localStorage.setItem("currentUser", JSON.stringify({
    username: "admin",
    role: "admin",
    fname: "Admin"
  }));

  const overlay = document.getElementById("adminLoginOverlay");
  const sidebar = document.getElementById("sidebar");
  const main = document.getElementById("main");

  if (overlay) overlay.style.display = "none";
  if (sidebar) sidebar.style.display = "block";
  if (main) main.style.display = "block";
  
  salesReport();
} else {
  alert("Invalid admin credentials.");
}
}

function customerLogin() {
const username = document.getElementById("customerUsername").value.trim();
const password = document.getElementById("customerPassword").value.trim();

if (!username || !password) {
  alert("Please enter both username and password.");
  return;
}

// Demo: Accept any non-empty credentials
localStorage.setItem("customerLoggedIn", "true");
localStorage.setItem("userType", "customer");
localStorage.setItem("currentUser", JSON.stringify({
  username: username,
  role: "customer",
  fname: username
}));

alert("Welcome, " + username + "!");
// Could redirect to customer page
document.getElementById("customerLoginOverlay").classList.remove("active");
}

function logout() {
localStorage.removeItem("adminLoggedIn");
localStorage.removeItem("customerLoggedIn");
localStorage.removeItem("userType");
localStorage.removeItem("currentUser");

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");
const overlay = document.getElementById("adminLoginOverlay");
const customerOverlay = document.getElementById("customerLoginOverlay");

if (sidebar) sidebar.style.display = "none";
if (main) main.style.display = "none";
if (overlay) overlay.style.display = "flex";
if (customerOverlay) customerOverlay.classList.remove("active");

// Clear inputs
document.getElementById("adminLoginUsername").value = "";
document.getElementById("adminLoginPassword").value = "";
}

function closeCustomerLogin() {
const overlay = document.getElementById("customerLoginOverlay");
if (overlay) overlay.classList.remove("active");
}

function switchLoginTab(tab) {
const buttons = document.querySelectorAll(".nav-btn");
buttons.forEach(btn => btn.classList.remove("active"));
event.target.classList.add("active");
// Can add more logic here for different forms
}

function toggleLoginPanel() {
const right = document.querySelector(".login-right");
right.style.display = right.style.display === "none" ? "flex" : "none";
}

function ensureAdminLogin() {
const adminLoggedIn = localStorage.getItem("adminLoggedIn") === "true";
const overlay = document.getElementById("adminLoginOverlay");
const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

if (!adminLoggedIn) {
  if (overlay) overlay.style.display = 'flex';
  if (sidebar) sidebar.style.display = 'none';
  if (main) main.style.display = 'none';
  return false;
}

if (overlay) overlay.style.display = 'none';
if (sidebar) sidebar.style.display = 'block';
if (main) main.style.display = 'block';
salesReport();
return true;
}

window.addEventListener("load", function () {
  ensureAdminLogin();

  const passwordInput = document.getElementById("adminLoginPassword");
  if (passwordInput) {
    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        adminLogin();
      }
    });
  }
});

/* CLOCK */

setInterval(()=>{
document.getElementById("clock").innerHTML =
new Date().toLocaleTimeString();
},1000);

/* SAMPLE DATA */

let gallonsInput = parseFloat(localStorage.getItem("gallons")) || 500;
let filterLife = parseFloat(localStorage.getItem("filterLife")) || 78;
let inventoryLogs = JSON.parse(localStorage.getItem("inventoryLogs")) || [];

/* ADD GALLONS */

function addGallons(count){
gallonsInput += count;
filterLife -= (count * 0.005);

if(filterLife < 0){
filterLife = 0;
}

inventoryFilter();
}

/* ================= SALES REPORT ================= */

function salesReport(){
document.getElementById("content").innerHTML = `
<div class="grid">
<div class="card stat">
<h2>120</h2>
<p>Daily Delivered Gallons</p>
</div>

<div class="card stat">
<h2>₱7,200</h2>
<p>Daily Income</p>
</div>

<div class="card stat">
<h2>850</h2>
<p>Weekly Delivered</p>
</div>

<div class="card stat">
<h2>₱210,000</h2>
<p>Monthly Sales</p>
</div>
</div>

<br>

<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
<h3>📈 Sales Overview</h3>

<select id="salesFilter"
style="
padding:8px 14px;
border:none;
border-radius:10px;
background:#0f4c75;
color:white;
font-weight:bold;
cursor:pointer;
"
onchange="updateSalesChart()">
<option value="today">Today</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select>
</div>

<br>

<canvas id="salesChart"></canvas>

<br>

<div class="card">
<h3>📊 Total Sales Summary</h3>
<br>

<table>
<tr>
<th>Period</th>
<th>Gallons Sold</th>
<th>Income</th>
</tr>

<tr>
<td>Today</td>
<td>120</td>
<td>₱7,200</td>
</tr>

<tr>
<td>This Week</td>
<td>850</td>
<td>₱52,000</td>
</tr>

<tr>
<td>This Month</td>
<td>3,200</td>
<td>₱210,000</td>
</tr>
</table>
</div>
`;

setTimeout(loadChart,100);
}

/* CHART */

let salesChart;

function loadChart(){
const ctx = document.getElementById("salesChart");

if (!ctx) return;

if (salesChart) {

let currentMonth = 4;
let currentYear = 2026;

const months = [
"January","February","March","April",
"May","June","July","August",
"September","October","November","December"
];

/* SAMPLE ATTENDANCE */

const attendance = {
1:{status:"Present", in:"8:00 AM", out:"5:00 PM"},
2:{status:"Late", in:"8:45 AM", out:"5:15 PM"},
4:{status:"Absent"},
5:{status:"Present", in:"7:55 AM", out:"5:00 PM"},
7:{status:"Absent"},
8:{status:"Late", in:"8:30 AM", out:"5:05 PM"},
11:{status:"Absent"},
14:{status:"Absent"},
15:{status:"Late", in:"8:40 AM", out:"5:20 PM"},
17:{status:"Absent"},
21:{status:"Late", in:"8:50 AM", out:"5:15 PM"},
23:{status:"Absent"},
28:{status:"Absent"},
30:{status:"Absent"},
31:{status:"Absent"}
};

function generateCalendar(){
const grid = document.getElementById("calendarGrid");

if(!grid) return;

grid.innerHTML = "";

document.getElementById("monthTitle").innerHTML = `📅 ${months[currentMonth]} ${currentYear}`;

const firstDay = new Date(currentYear,currentMonth,1).getDay();
const totalDays = new Date(currentYear,currentMonth + 1,0).getDate();

for(let i=0;i<firstDay;i++){
grid.innerHTML += `<div class="day empty"></div>`;
}

for(let day=1; day<=totalDays; day++){
let data = attendance[day];
let className = "presentDay";
let content = "";

if(data){
if(data.status === "Late"){
className = "lateDay";
}
else if(data.status === "Absent"){
className = "absentDay";
}

content = `
<div class="day-number">${day}</div>
<div class="time">
${data.in ? `🕘 ${data.in}<br>` : ""}
${data.out ? `🕕 ${data.out}` : "No Attendance"}
</div>
<div class="status-label">${data.status}</div>
`;
}
else{
content = `
<div class="day-number">${day}</div>
<div class="time">🕘 8:00 AM<br>🕕 5:00 PM</div>
<div class="status-label">Present</div>
`;
}

grid.innerHTML += `<div class="day ${className}">${content}</div>`;
}
}

function prevMonth(){
currentMonth--;

if(currentMonth < 0){
currentMonth = 11;
currentYear--;
}

generateCalendar();
}

function nextMonth(){
currentMonth++;

if(currentMonth > 11){
currentMonth = 0;
currentYear++;
}

generateCalendar();
}
