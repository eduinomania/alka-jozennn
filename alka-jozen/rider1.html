<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Alka-Jozen Rider Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', sans-serif; }

body {
  min-height: 100vh;
  background: linear-gradient(160deg, #2a8bc4 0%, #3fa0d8 40%, #65bde8 100%);
  overflow-x: hidden;
}

/* Dot grid */
.bg-dots {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* Blobs */
.blob { position: fixed; border-radius: 50%; filter: blur(70px); z-index: 0; pointer-events: none; animation: blobFloat 14s infinite ease-in-out; }
.blob1 { width: 380px; height: 380px; background: rgba(56,189,248,0.2); top: -120px; left: -100px; }
.blob2 { width: 260px; height: 260px; background: rgba(14,165,233,0.16); bottom: -80px; right: -80px; animation-delay: -5s; }
.blob3 { width: 180px; height: 180px; background: rgba(125,211,252,0.12); top: 45%; left: 60%; animation-delay: -9s; }
@keyframes blobFloat { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-22px) scale(1.05);} }

/* SIDEBAR */
.sidebar {
  width: 220px; height: 100vh;
  position: fixed; left: 0; top: 0;
  background: linear-gradient(185deg, #1a6daa 0%, #1e78b8 55%, #2282c4 100%);
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 16px;
  box-shadow: 4px 0 30px rgba(8,50,100,0.25);
  z-index: 100;
  overflow: hidden;
}
.sidebar::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, transparent 55%);
  pointer-events: none;
}

.brand-icon {
  width: 62px; height: 62px;
  background: rgba(255,255,255,0.15);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  border: 1.5px solid rgba(255,255,255,0.22);
  box-shadow: 0 4px 22px rgba(0,0,0,0.18);
  position: relative; z-index: 1;
}
.brand-icon i { font-size: 26px; color: #90d8f8; filter: drop-shadow(0 0 8px rgba(144,216,248,0.55)); }

.brand-name { font-size: 16px; font-weight: 800; color: #fff; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.18); position: relative; z-index: 1; }
.brand-tagline { font-size: 11px; color: rgba(255,255,255,0.52); margin-top: 2px; text-align: center; font-weight: 600; position: relative; z-index: 1; }

.sidebar-nav { margin-top: 32px; width: 100%; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }

.nav-btn {
  width: 100%; border: none;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.62);
  font-size: 13px; font-weight: 700;
  cursor: pointer; transition: 0.2s;
  border: 1px solid transparent;
  text-align: left;
}
.nav-btn i { font-size: 14px; width: 16px; }
.nav-btn:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateX(3px); }
.nav-btn.active {
  background: rgba(255,255,255,0.2); color: #fff;
  border-color: rgba(255,255,255,0.22);
  box-shadow: 0 2px 12px rgba(0,0,0,0.14);
}

.sidebar-bottom {
  margin-top: auto; position: relative; z-index: 1;
  width: 100%;
}
.rider-badge {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 14px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.18);
}
.rider-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #38bdf8, #0284c7);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: white; font-weight: 800; flex-shrink: 0;
}
.rider-info { overflow: hidden; }
.rider-name { font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rider-role { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 600; }

/* MAIN */
.main {
  margin-left: 220px;
  min-height: 100vh;
  display: flex; flex-direction: column;
  position: relative; z-index: 1;
}

/* TOP BAR */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 30px;
  background: rgba(168,214,238,0.38);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.3);
}
.page-title { font-size: 20px; font-weight: 800; color: rgba(255,255,255,0.92); text-shadow: 0 1px 5px rgba(10,55,105,0.18); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.clock {
  background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.42);
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.92);
  min-width: 108px; text-align: center;
}
.stat-pill {
  background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
  padding: 6px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.88);
  display: flex; align-items: center; gap: 5px;
}
.stat-pill i { font-size: 11px; color: #90d8f8; }

/* CONTENT */
.content { padding: 28px 30px; flex: 1; }

/* GLASS CARD */
.card {
  background: rgba(220,238,250,0.45);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.55);
  border-radius: 20px; padding: 22px 24px;
  margin-bottom: 16px;
  box-shadow: 0 8px 30px rgba(10,55,105,0.1), inset 0 1px 0 rgba(255,255,255,0.6);
  transition: 0.25s ease;
  animation: cardIn 0.4s ease both;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(10,55,105,0.15); }
@keyframes cardIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

/* Card header */
.card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 800; color: #0d3460; }
.order-badge {
  background: rgba(56,189,248,0.18); border: 1px solid rgba(56,189,248,0.35);
  color: #0284c7; font-size: 11px; font-weight: 800;
  padding: 3px 10px; border-radius: 20px;
}

/* Info rows */
.info-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #1e4976; }
.info-row i { color: #38bdf8; width: 14px; font-size: 12px; }

/* Status badge */
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;
  background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.3); color: #0284c7;
}
.status-badge.delivered { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.3); color: #16a34a; }
.status-badge.pending { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.3); color: #d97706; }

/* STEP BUTTONS */
.steps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.step-btn {
  border: 1.5px solid rgba(255,255,255,0.6);
  padding: 10px 12px; border-radius: 12px;
  background: rgba(255,255,255,0.4);
  color: #0d3460; font-weight: 700; font-size: 12px;
  cursor: pointer; transition: 0.2s;
  display: flex; align-items: center; gap: 6px;
  font-family: 'Nunito', sans-serif;
}
.step-btn:hover { background: rgba(255,255,255,0.65); transform: translateY(-1px); }
.step-btn.active-step {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white; border-color: transparent;
  box-shadow: 0 4px 14px rgba(34,197,94,0.3);
}
.step-btn.done-step {
  background: rgba(34,197,94,0.12);
  color: #16a34a; border-color: rgba(34,197,94,0.3);
}
.step-btn i { font-size: 11px; }

/* ACTION BUTTONS */
.action-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 120px; padding: 11px 16px; border: none; border-radius: 12px;
  font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.22s;
  font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-primary {
  background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 60%, #0284c7 100%);
  color: white; box-shadow: 0 4px 15px rgba(56,189,248,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(56,189,248,0.45); }
.btn-secondary {
  background: rgba(255,255,255,0.45); color: #0d3460;
  border: 1.5px solid rgba(255,255,255,0.65);
}
.btn-secondary:hover { background: rgba(255,255,255,0.65); }
.btn-success {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white; box-shadow: 0 4px 14px rgba(34,197,94,0.3);
}
.btn-success:hover { transform: translateY(-2px); }

/* SECTION TITLE */
.section-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 18px; text-shadow: 0 1px 6px rgba(10,55,105,0.2); display: flex; align-items: center; gap: 8px; }
.section-title i { color: #90d8f8; }

/* STATS GRID */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: rgba(220,238,250,0.45);
  backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.55);
  border-radius: 18px; padding: 18px 20px;
  box-shadow: 0 6px 20px rgba(10,55,105,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
  animation: cardIn 0.4s ease both;
}
.stat-label { font-size: 11px; font-weight: 700; color: rgba(13,52,96,0.6); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 800; color: #0d3460; }
.stat-sub { font-size: 11px; font-weight: 600; color: rgba(13,52,96,0.5); margin-top: 2px; }
.stat-icon { float: right; width: 38px; height: 38px; border-radius: 12px; background: rgba(56,189,248,0.15); display: flex; align-items: center; justify-content: center; margin-top: -4px; }
.stat-icon i { font-size: 16px; color: #0ea5e9; }

/* CHART CARD */
.chart-card {
  background: rgba(220,238,250,0.45);
  backdrop-filter: blur(18px);
  border: 1.5px solid rgba(255,255,255,0.55);
  border-radius: 20px; padding: 22px 24px;
  box-shadow: 0 8px 30px rgba(10,55,105,0.1), inset 0 1px 0 rgba(255,255,255,0.6);
  animation: cardIn 0.4s ease 0.1s both;
}
.chart-card canvas { max-height: 220px; }

/* RATING */
.rating { display: flex; gap: 3px; margin-top: 10px; }
.rating i { color: #f59e0b; font-size: 16px; }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: rgba(13,52,96,0.5); }
.empty-state i { font-size: 40px; color: rgba(56,189,248,0.4); margin-bottom: 12px; display: block; }
.empty-state p { font-size: 14px; font-weight: 600; }

/* MODAL */
.modal {
  position: fixed; inset: 0;
  background: rgba(10,40,80,0.55);
  display: flex; justify-content: center; align-items: center;
  z-index: 9999; backdrop-filter: blur(8px);
}
.modal-box {
  width: 90%; max-width: 430px;
  background: rgba(236,246,255,0.98);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 32px; padding: 30px 28px;
  box-shadow: 0 28px 70px rgba(16,80,139,0.18);
  animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn { from{transform:scale(0.94);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal-title { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
.modal-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(15,76,117,0.12); font-size: 14px; }
.modal-row:last-of-type { border-bottom: none; }
.modal-label { font-weight: 700; color: rgba(15,76,117,0.72); }
.modal-value { font-weight: 700; color: #0f172a; text-align: right; }
.modal-actions { display: flex; justify-content: space-between; gap: 16px; margin-top: 24px; }

/* DIVIDER */
.divider { height: 1px; background: rgba(255,255,255,0.35); margin: 4px 0 16px; }

/* MOBILE OPTIMIZED */
@media (max-width: 768px) {

  body{
    padding-bottom:90px;
  }

  .sidebar{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:72px;
    padding:8px 10px;
    z-index:999;
    border-top:1px solid rgba(255,255,255,0.15);

    background:rgba(18,95,150,0.92);
    backdrop-filter:blur(20px);

    flex-direction:row;
    justify-content:space-around;
    align-items:center;
  }

  .brand-icon,
  .brand-name,
  .brand-tagline,
  .sidebar-bottom{
    display:none;
  }

  .sidebar-nav{
    width:100%;
    display:flex;
    flex-direction:row;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin:0;
  }

  .nav-btn{
    flex:1;
    min-width:0;
    padding:10px 6px;
    border-radius:14px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;

    font-size:10px;
    font-weight:800;

    background:transparent;
  }

  .nav-btn i{
    font-size:18px;
    width:auto;
  }

  .nav-btn.active{
    background:rgba(255,255,255,0.15);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    padding:14px;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;

    position:sticky;
    top:0;
  }

  .page-title{
    font-size:18px;
  }

  .topbar-right{
    width:100%;
    justify-content:space-between;
  }

  .clock{
    min-width:auto;
    padding:6px 12px;
    font-size:11px;
  }

  .content{
    padding:14px;
  }

  .card{
    padding:18px;
    border-radius:18px;
  }

  .card-header{
    gap:10px;
    flex-direction:column;
    align-items:flex-start;
  }

  .card-title{
    font-size:15px;
  }

  .info-row{
    font-size:12px;
    line-height:1.5;
  }

  .action-row{
    flex-direction:column;
  }

  .btn{
    width:100%;
    min-width:100%;
    padding:13px;
    font-size:13px;
  }

  .steps-grid{
    grid-template-columns:1fr;
  }

  .step-btn{
    width:100%;
    justify-content:flex-start;
    padding:13px;
    font-size:12px;
  }

  .stats-grid{
    grid-template-columns:1fr;
  }

  .stat-card{
    padding:18px;
  }

  .stat-value{
    font-size:24px;
  }

  .chart-card{
    padding:18px;
    overflow-x:auto;
  }

  .chart-card canvas{
    min-width:320px;
    max-height:220px;
  }

  .modal{
    padding:16px;
  }

  .modal-box{
    width:100%;
    max-width:100%;
    padding:22px 18px;
    border-radius:22px;
  }

  .modal-title{
    font-size:17px;
  }

  .modal-row{
    gap:10px;
    align-items:flex-start;
  }

  .modal-label,
  .modal-value{
    font-size:12px;
  }

}


/* ---- MANAGER QR VERIFICATION (pre-login) ---- */
.qr-auth-overlay {
  position: fixed; inset: 0;
  background: rgba(10,40,80,0.55);
  display: flex; justify-content: center; align-items: center;
  z-index: 99999; backdrop-filter: blur(8px);
}
.qr-auth-box {
  width: 90%; max-width: 430px;
  background: rgba(236,246,255,0.98);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 32px; padding: 30px 28px;
  box-shadow: 0 28px 70px rgba(16,80,139,0.18);
  animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1);
  text-align: center;
}
.qr-auth-step {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; color: rgba(13,52,96,0.55);
  background: rgba(56,189,248,0.14); border: 1px solid rgba(56,189,248,0.3);
  padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
}
.qr-auth-subtitle {
  font-size: 13px; font-weight: 600; color: #1e4976;
  line-height: 1.6; margin-bottom: 16px;
}
.qr-auth-camera {
  width: 320px; max-width: 100%; height: 260px;
  margin: 0 auto; border-radius: 18px; overflow: hidden;
  background: rgba(13,52,96,0.05);
}
.qr-auth-result {
  margin-top: 12px; font-weight: 800; color: #0d3460; min-height: 18px;
}
.qr-auth-tip {
  margin-top: 12px; padding: 12px 14px; border-radius: 14px;
  background: rgba(56,189,248,0.12); color: #0d3460;
  font-size: 12px; font-weight: 700; line-height: 1.5;
}
.qr-auth-fail { color: #ef4444 !important; }
.qr-auth-pass { color: #16a34a !important; }
@media (max-width: 768px) {
  .qr-auth-box { padding: 22px 18px; border-radius: 22px; }
  .qr-auth-camera { width: 100%; height: 240px; }
}

</style>
</head>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<body>

<div class="bg-dots"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand-icon"><i class="fa-solid fa-droplet"></i></div>
  <div class="brand-name">Alka-Jozen</div>
  <div class="brand-tagline">Rider Portal</div>

  <div class="sidebar-nav">
    <button class="nav-btn active" id="nav-incoming" onclick="setNav('incoming'); loadOrders()">
      <i class="fa-solid fa-box-open"></i> Incoming
    </button>
    <button class="nav-btn" id="nav-active" onclick="setNav('active'); active()">
      <i class="fa-solid fa-motorcycle"></i> Active
    </button>
    <button class="nav-btn" id="nav-earnings" onclick="setNav('earnings'); earnings()">
      <i class="fa-solid fa-peso-sign"></i> Earnings
    </button>
    <button class="nav-btn" id="nav-delivered" onclick="setNav('delivered'); delivered()">
      <i class="fa-solid fa-circle-check"></i> Delivered
    </button>
  <button class="nav-btn" onclick="showLogoutModal()">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</div>
  </div>

  <div class="sidebar-bottom">
    <div class="rider-badge">
      <div class="rider-avatar" id="riderAvatar">R</div>
      <div class="rider-info">
        <div class="rider-name" id="riderNameBadge">Rider</div>
        <div class="rider-role">Delivery Rider</div>
      </div>
    </div>
  </div>
</div>


<!-- MANAGER QR VERIFICATION OVERLAY -->
<div class="qr-auth-overlay" id="managerQrOverlay" style="display:none;">
  <div class="qr-auth-box">
    <div class="qr-auth-step"><i class="fa-solid fa-shield-halved"></i> Manager Verification</div>
    <div style="font-size:20px;font-weight:800;color:#0f172a;margin-bottom:6px;">
      <i class="fa-solid fa-qrcode" style="color:#38bdf8;"></i> Scan Manager QR Code
    </div>
    <div class="qr-auth-subtitle">
      To log in, scan the QR code provided by your manager.
    </div>
    <div class="qr-auth-camera" id="managerQrReader"></div>
    <div class="qr-auth-result" id="managerQrResult"></div>
    <div class="qr-auth-tip">
      <i class="fa-solid fa-circle-info"></i> After scanning, you will be
      signed in to your rider dashboard automatically.
    </div>
    <div class="action-row" style="margin-top:18px;justify-content:center;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="managerStartScanBtn" onclick="startManagerQrScan()">
        <i class="fa-solid fa-camera"></i> Start Scanning
      </button>
      <button class="btn btn-secondary" onclick="manualManagerKey()">
        <i class="fa-solid fa-key"></i> Enter Key Manually
      </button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" style="display:none;">
  <div class="topbar">

/* CLOCK */
function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clockDisplay').textContent =
    `${String(h).padStart(2,'0')}:${m}:${s} ${ampm}`;
}
updateClock(); setInterval(updateClock, 1000);

/* RIDER NAME */
function getRiderName() { return localStorage.getItem("username") || "Rider"; }
function initRiderBadge() {
  const name = getRiderName();
  document.getElementById('riderNameBadge').textContent = name;
  document.getElementById('riderAvatar').textContent = name.charAt(0).toUpperCase();
}
initRiderBadge();

/* STORAGE */
function getOrders() { return JSON.parse(localStorage.getItem("history")) || []; }
function save(data) { localStorage.setItem("history", JSON.stringify(data)); }
function getName(o) { return o.name || o.user || "Unknown"; }

const riderLocationWatches = {};

function startRiderLocationTracking(orderIdx){
  if(!navigator.geolocation){
    showRiderToast('Live location is not supported by this browser.');
    return;
  }

  const oldWatch = riderLocationWatches[orderIdx];
  if(oldWatch !== undefined) navigator.geolocation.clearWatch(oldWatch);

  const watchId = navigator.geolocation.watchPosition(position => {
    const orders = getOrders();
    const order = orders[orderIdx];
    if(!order) return;

    order.liveLocation = {
      latitude: position.coords.latitude,
      longitude: position.coords.longitude,
      accuracy: Math.round(position.coords.accuracy || 0),
      rider: getRiderName(),
      updatedAt: new Date().toISOString()
    };
    save(orders);
  }, error => {
    console.warn('Live location error:', error.message);
    showRiderToast('Allow location access to share live delivery location.');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 });

  riderLocationWatches[orderIdx] = watchId;
}

function stopRiderLocationTracking(orderIdx){
  const watchId = riderLocationWatches[orderIdx];
  if(watchId !== undefined){
    navigator.geolocation.clearWatch(watchId);
    delete riderLocationWatches[orderIdx];
  }
}

function openCustomerRoute(orderIdx){
  const order = getOrders()[orderIdx];
  if(!order) return;

  const location = order.liveLocation;
  const origin = location ? `${location.latitude},${location.longitude}` : '';
  const destination = encodeURIComponent(order.address || 'Urduja, Caloocan City');
  const routeUrl = origin
    ? `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`
    : `https://www.google.com/maps/search/?api=1&query=${destination}`;
  window.open(routeUrl, '_blank', 'noopener');
}
function isAssignedToCurrentRider(order) {
  if (getRiderName() === "rider") {
    return Boolean(order.assignedRiderId || order.assignedRiderName);
  }
  return order.assignedRiderId === getRiderName() ||
    order.assignedRiderName === getRiderName();
}

function canReceiveIncomingOrder(order) {
  const isUnassigned = !order.assignedRiderId && !order.assignedRiderName;
  return isUnassigned || isAssignedToCurrentRider(order);
}

function notifyOrderUpdate(order, status) {
  const notifications = JSON.parse(localStorage.getItem("notifications") || "[]");
  notifications.push({
    id: `order-update-${order.orderNumber || Date.now()}-${Date.now()}`,
    type: "order-update",
    orderNumber: order.orderNumber,
    riderName: getRiderName(),
    customerName: order.name || order.user || "Customer",
    status,
    message: `Order #${order.orderNumber || "N/A"} is now ${status}.`,
    date: new Date().toLocaleDateString(),
    time: new Date().toLocaleTimeString(),
    timestamp: Date.now()
  });
  localStorage.setItem("notifications", JSON.stringify(notifications));
}
function showRiderToast(message) {
  const toast = document.createElement("div");
  toast.textContent = message;
  toast.style.cssText = "position:fixed;top:20px;right:20px;z-index:100000;max-width:320px;padding:14px 18px;border-radius:14px;background:#0ea5e9;color:#fff;font-weight:800;box-shadow:0 10px 30px rgba(10,55,105,0.25);";
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

function checkAssignedOrderNotifications() {
  const seen = JSON.parse(localStorage.getItem("seenOrderAssignmentNotifications") || "[]");
  const notifications = JSON.parse(localStorage.getItem("notifications") || "[]");
  const riderName = getRiderName();
  const newAssignments = notifications.filter(notification =>
    notification.type === "order-assigned" &&
    (riderName === "rider" || notification.riderId === riderName || notification.riderName === riderName) &&
    !seen.includes(notification.id)
  );

  newAssignments.forEach(notification => {
    showRiderToast(`📦 ${notification.message}`);
    seen.push(notification.id);
  });

  if(newAssignments.length > 0){
    localStorage.setItem("seenOrderAssignmentNotifications", JSON.stringify(seen));
    loadOrders();
  }
}

function checkNewOrderNotifications() {
  const seen = JSON.parse(localStorage.getItem("seenNewOrderNotifications") || "[]");
  const notifications = JSON.parse(localStorage.getItem("notifications") || "[]");
  const newOrders = notifications.filter(notification =>
    notification.type === "order-created" && !seen.includes(notification.id)
  );

  newOrders.forEach(notification => {
    showRiderToast(`🆕 ${notification.message}`);
    seen.push(notification.id);
  });

  if(newOrders.length > 0){
    localStorage.setItem("seenNewOrderNotifications", JSON.stringify(seen));
    loadOrders();
  }
}

checkAssignedOrderNotifications();
checkNewOrderNotifications();
setInterval(checkAssignedOrderNotifications, 2000);
setInterval(checkNewOrderNotifications, 2000);

/* NAV */
function setNav(id) {

loadOrders();

  const o = getOrders();

    .filter(item =>

  } else {

            <div class="card-title"><i class="fa-solid fa-box" style="color:#38bdf8;margin-right:6px;"></i>${x.orderNumber || '#00' + (i+1)}</div>
            <span class="status-badge pending" style="margin-top:5px;display:inline-flex;"><i class="fa-solid fa-clock"></i> Pending</span>

      </div>`;

}

/* ACCEPT */
function accept(i) {
  const o = getOrders();
  o[i].status = "Go to Pickup";
  o[i].rider = getRiderName();
  save(o);
  notifyOrderUpdate(o[i], o[i].status);
  setNav('active'); active();
}

/* ACTIVE */
const stepFlow = ["Go to Pickup","Collecting Gallon","Cleaning","Refilling","Out for Delivery","Delivered"];
const stepIcons = ["fa-route","fa-bucket","fa-soap","fa-fill-drip","fa-truck-fast","fa-circle-check"];

function active() {
  const o = getOrders();
  const activeOrders = o.filter(x =>
    x.status &&
    x.status !== "Order Received" &&
    x.status !== "Accepted" &&
    x.status !== "Delivered" &&
    isAssignedToCurrentRider(x)
  );
  let html = '';

  if (activeOrders.length === 0) {
    html += buildActiveCard(-1, {
      orderNumber: '#001', name: 'Juan Dela Cruz', address: 'Urduja, Caloocan City',
      total: 150, status: 'Go to Pickup', contact: '09xx-xxx-xxxx'
    }, true);
  } else {
    activeOrders.forEach((x, i) => {
      const realIdx = o.indexOf(x);
      html += buildActiveCard(realIdx, x, false);
    });
  }
  document.getElementById('content').innerHTML = html;
}

function buildActiveCard(idx, x, isSample) {
  const curStep = stepFlow.indexOf(x.status);
  const steps = stepFlow.map((step, si) => {
    let cls = '';
    if (si < curStep) cls = 'done-step';
    else if (si === curStep) cls = 'active-step';
    const clickFn = isSample ? `alert('Sample order only')` : `setStatus(${idx},'${step}')`;
    return `<button class="step-btn ${cls}" onclick="${clickFn}"><i class="fa-solid ${stepIcons[si]}"></i>${step}</button>`;
  }).join('');

  const detailFn = isSample ? `alert('Sample order only')` : `showDetails(${idx})`;
  return `
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title"><i class="fa-solid fa-motorcycle" style="color:#38bdf8;margin-right:6px;"></i>${x.orderNumber || '#001'}</div>
        <span class="status-badge" style="margin-top:5px;display:inline-flex;"><i class="fa-solid fa-circle-dot"></i> ${x.status}</span>
      </div>
      ${isSample ? '<div class="order-badge">Sample</div>' : ''}
    </div>
    <div class="info-row"><i class="fa-solid fa-user"></i> ${x.name || x.user || 'Juan Dela Cruz'}</div>
    <div class="info-row"><i class="fa-solid fa-person-biking"></i> Rider: ${getRiderName()}</div>
    <div class="info-row"><i class="fa-solid fa-location-dot"></i> ${x.address || 'Urduja, Caloocan City'}</div>
    <div class="divider"></div>
    <div style="font-size:12px;font-weight:800;color:rgba(13,52,96,0.6);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px;">Delivery Steps</div>
    <div class="steps-grid">${steps}</div>
    <div class="action-row">
      <button class="btn btn-secondary" onclick="${detailFn}"><i class="fa-solid fa-eye"></i> View Details</button>
      <button class="btn btn-secondary" onclick="${ isSample ? "alert('Sample order only')" : `openCustomerRoute(${idx})` }"><i class="fa-solid fa-route"></i> Customer Route</button>
      <button class="btn btn-primary" onclick="${ isSample ? "alert('Sample order only')" : `openGallonScannerModal(${idx})` }"><i class="fa-solid fa-qrcode"></i> Scan Gallon</button>
      <button class="btn btn-success" onclick="${ isSample ? "alert('Sample order only')" : `openAttendanceScannerModal(${idx})` }"><i class="fa-solid fa-camera"></i> Scan Attendance</button>
    </div>
  </div>`;
}

function setStatus(i, status) {
  const o = getOrders();
  if (!o[i] || o[i].status === status) return;
  o[i].status = status;
  if (status === "Delivered") o[i].deliveredAt = new Date().toLocaleString();
  if (status === "Delivered") stopRiderLocationTracking(i);
  save(o);
  notifyOrderUpdate(o[i], status);
  active();
}

function renderChart(labels, data) {

  if (earningsChart) {
    earningsChart.destroy();
  }

  earningsChart = new Chart(ctx, {

    type: 'bar',

    data: {
      labels: labels,
      datasets: [{
        label: 'Income (₱)',
        data: data,

        backgroundColor: 'rgba(56,189,248,0.55)',
        borderColor: '#0ea5e9',

window.onload = function () {
  if (!ensureRiderLogin()) {
    return;
  }

  const attendanceState = localStorage.getItem("attendanceState") || "none";

  if (attendanceState === "none") {
    showAttendanceModal();
  }

  else if (attendanceState === "waiting") {
    showWaitingApproval();
  }

  else if (attendanceState === "approved") {
    loadOrders();
  }

  else if (attendanceState === "rejected") {
    document.getElementById("content").innerHTML = `
      <div class="card" style="text-align:center;padding:60px;">
        <h1 style="font-size:60px;">❌</h1>
        <h2>Attendance Rejected</h2>
        <p>Please contact your manager.</p>
      </div>
    `;
  }

};

function getCurrentAttendanceRequest() {
  const requestId = localStorage.getItem("currentAttendanceRequestId");
  const notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  return notifications.find(n => n.id === requestId) || null;
}

function clearAttendanceStatusInterval() {
  if (window.attendanceStatusInterval) {
    clearInterval(window.attendanceStatusInterval);
    window.attendanceStatusInterval = null;
  }
}

function checkAttendanceStatus() {
  const request = getCurrentAttendanceRequest();
  if (!request) return;

  if (request.status === "Approved") {
    clearAttendanceStatusInterval();
    localStorage.setItem("attendanceState", "approved");
    closeApproval();
    showApprovalResult("approved");
    return;
  }

  if (request.status === "Rejected") {
    clearAttendanceStatusInterval();
    localStorage.setItem("attendanceState", "rejected");
    closeApproval();
    showApprovalResult("rejected");
    return;
  }
}

function updateCurrentAttendanceRequestStatus(status) {
  const request = getCurrentAttendanceRequest();
  if (!request) return null;

  const notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  const item = notifications.find(n => n.id === request.id);
  if (!item) return null;

  item.status = status;
  localStorage.setItem("notifications", JSON.stringify(notifications));
  localStorage.setItem("attendanceState", status.toLowerCase());
  return item;
}

function markAttendance(riderId, method = "QR") {
  const now = new Date();
  const requestId = `att-${Date.now()}-${Math.floor(Math.random() * 1000)}`;

  const request = {
    id: requestId,
    riderId,
    riderName: getRiderName(),
    date: now.toLocaleDateString(),
    time: now.toLocaleTimeString(),
    method,
    status: "Pending",
    timestamp: now.getTime()
  };

  const notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  notifications.push(request);
  localStorage.setItem("notifications", JSON.stringify(notifications));
  localStorage.setItem("currentAttendanceRequestId", requestId);
  localStorage.setItem("attendanceState", "waiting");
  localStorage.setItem("attendanceRequest", JSON.stringify(request));

  alert("Attendance request submitted and waiting for manager approval ✅");
}

function requestManualAttendance() {
  const riderId = getRiderName();
  const confirmation = confirm("Scanner unavailable? Submit manual attendance anyway?");
  if (!confirmation) return;
  markAttendance(riderId, "Manual");
  const modal = document.getElementById('attendanceModal');
  if (modal) modal.remove();
  showWaitingApproval();
}

<script>

/* =========================================================
   MANAGER QR VERIFICATION — required before login
   QR payload format: manager_auth|<managerUsername>|<code>
   The code is generated live by the Manager Dashboard while
   the manager is logged in, so this QR is tied to the
   manager's actual login session (shared via localStorage).
   ========================================================= */
let managerQrScanner = null;

function getManagerQrSession() {
  try { return JSON.parse(localStorage.getItem("managerQrSession") || "null"); }
  catch (e) { return null; }
}

function isManagerLoggedIn() {
  return localStorage.getItem("managerLoggedIn") === "true";
}

function verifyManagerQrCode(scannedUsername, scannedCode) {
  const session = getManagerQrSession();
  if (!session) return false;
  if (!isManagerLoggedIn()) return false;               // manager must be signed in
  if (Date.now() > (session.expiresAt || 0)) return false; // QR expired
  return scannedUsername === session.username &&
         scannedCode === session.code;                  // code must match session
}

/* QR provided by the manager = rider login.
   Scanning a valid manager QR signs the rider in directly —
   no separate username/password step. */
function completeRiderLogin() {
  localStorage.setItem("riderLoggedIn", "true");
  localStorage.setItem("username", "rider");
  localStorage.setItem("currentUser", JSON.stringify({
    username: "rider",
    role: "rider",
    fname: "Rider"
  }));
  const overlay = document.getElementById("managerQrOverlay");
  if (overlay) overlay.style.display = "none";
  document.querySelector('.main').style.display = 'block';
  loadOrders();
}

function showManagerQrOverlay() {
  const overlay = document.getElementById("managerQrOverlay");
  overlay.style.display = "flex";
  document.querySelector('.main').style.display = 'none';
}

function startManagerQrScan() {
  const btn = document.getElementById("managerStartScanBtn");
  if (btn) btn.disabled = true;
  const resultEl = document.getElementById("managerQrResult");
  if (resultEl) resultEl.textContent = "Starting camera…";

  managerQrScanner = new Html5Qrcode("managerQrReader");

  Html5Qrcode.getCameras().then(cameras => {
    const cameraId = cameras && cameras.length ? cameras[0].id : null;
    managerQrScanner.start(
      cameraId,
      { fps: 10, qrbox: 250 },
      qrCodeMessage => {
        verifyManagerQr(qrCodeMessage);
      },
      errorMessage => { }
    ).catch(err => {
      console.error(err);
      if (resultEl) {
        resultEl.textContent = "Unable to start camera. Use 'Enter Key Manually' or make sure camera permission is allowed.";
        resultEl.className = "qr-auth-result qr-auth-fail";
      }
      if (btn) btn.disabled = false;
    });
  }).catch(err => {
    console.error(err);
    if (resultEl) {
      resultEl.textContent = "No camera found on this device. Use 'Enter Key Manually' instead.";
      resultEl.className = "qr-auth-result qr-auth-fail";
    }
    if (btn) btn.disabled = false;
  });
}

function verifyManagerQr(qrCodeMessage) {
  const resultEl = document.getElementById("managerQrResult");
  try {
    if (qrCodeMessage && qrCodeMessage.startsWith("manager_auth|")) {
      const parts = qrCodeMessage.split("|");
      const scannedUsername = parts[1];
      const scannedCode = parts[2];
      if (verifyManagerQrCode(scannedUsername, scannedCode)) {
        if (managerQrScanner) { managerQrScanner.stop().catch(e => console.error(e)); }
        localStorage.setItem("managerQrVerified", "true");
        localStorage.setItem("managerQrVerifiedAt", new Date().toISOString());
        if (resultEl) {
          resultEl.textContent = "Manager verified! Signing you in…";
          resultEl.className = "qr-auth-result qr-auth-pass";
        }
        setTimeout(() => {
          completeRiderLogin();
        }, 900);
        return;
      }
    }
    if (resultEl) {
      resultEl.textContent = "QR not recognized. Make sure the manager is signed in and this QR was just generated.";
      resultEl.className = "qr-auth-result qr-auth-fail";
    }
  } catch (e) {
    console.error(e);
    if (resultEl) {
      resultEl.textContent = "QR not recognized. Make sure the manager is signed in and this QR was just generated.";
      resultEl.className = "qr-auth-result qr-auth-fail";
    }
  }
}

function manualManagerKey() {
  const existing = document.getElementById("manualManagerKeyModal");
  if (existing) existing.remove();

  const modal = document.createElement("div");
  modal.className = "modal";
  modal.id = "manualManagerKeyModal";
  modal.style.zIndex = "100000";
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">
        <i class="fa-solid fa-key" style="color:#38bdf8;"></i>
        Enter Rider Attendance QR Code
      </div>
      <p style="color:#1e4976;font-size:13px;font-weight:700;line-height:1.5;">
        Enter the authorization code shown on the manager's Rider Attendance QR screen.
      </p>
      <input id="manualManagerKeyInput" type="text" maxlength="6" autocomplete="off"
        placeholder="Enter 6-character code"
        style="width:100%;margin-top:16px;padding:12px;border-radius:12px;border:1px solid rgba(13,52,96,0.2);font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;">
      <div id="manualManagerKeyMessage" style="min-height:20px;margin-top:10px;font-size:12px;font-weight:800;"></div>
      <div class="action-row" style="margin-top:16px;">
        <button class="btn btn-primary" onclick="submitManualManagerKey()">
          <i class="fa-solid fa-check"></i> Verify Code
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('manualManagerKeyModal').remove()">
          Cancel
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const input = document.getElementById("manualManagerKeyInput");
  input.focus();
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") submitManualManagerKey();
  });
}

function submitManualManagerKey() {
  const input = document.getElementById("manualManagerKeyInput");
  const message = document.getElementById("manualManagerKeyMessage");
  if (!input || !message) return;

  const trimmed = input.value.trim().toUpperCase();
  const session = getManagerQrSession();
  if (session && isManagerLoggedIn() &&
      Date.now() <= (session.expiresAt || 0) &&
      trimmed === session.code) {
    localStorage.setItem("managerQrVerified", "true");
    localStorage.setItem("managerQrVerifiedAt", new Date().toISOString());
    const resultEl = document.getElementById("managerQrResult");
    const modal = document.getElementById("manualManagerKeyModal");
    if (modal) modal.remove();
    if (resultEl) {
      resultEl.textContent = "Code accepted! Signing you in…";
      resultEl.className = "qr-auth-result qr-auth-pass";
    }
    setTimeout(() => {
      completeRiderLogin();
    }, 800);
  } else {
    message.textContent = "Incorrect or expired code. Ask your manager for a fresh code.";
    message.style.color = "#ef4444";
    input.select();
  }
}

/* ---- Rider login: the manager-provided QR IS the login ---- */
function riderLogin() {
  // QR gate: login is locked until the manager's QR is scanned
  if (localStorage.getItem("managerQrVerified") !== "true") {
    alert("Please scan your manager's QR code first before signing in.");
    const overlay = document.getElementById("managerQrOverlay");
    if (overlay) overlay.style.display = "flex";
    document.querySelector('.main').style.display = 'none';
    return;
  }

  // QR verified → sign the rider in directly
  completeRiderLogin();
}

function showRiderLoginOverlay() {
  // No username/password overlay — the manager QR is the login.
  completeRiderLogin();
}

/* On startup: enforce manager QR scan BEFORE login */
window.addEventListener("DOMContentLoaded", function () {
  const main = document.querySelector('.main');
  if (main) main.style.display = 'none';
  showManagerQrOverlay();
});

</script>
</body>
