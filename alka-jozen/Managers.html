<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manager Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f4c75 0%,
        #3282b8 25%,
        #bbe1fa 50%,
        #3282b8 75%,
        #0f4c75 100%
    );

    background-size: 400% 400%;
    animation: waterFlow 20s ease infinite;
    overflow-x:hidden;
    min-height: 100vh;
    color:#0f172a;
}

@keyframes waterFlow {
    0% { background-position: 0% 50%; }
    25% { background-position: 100% 50%; }
    50% { background-position: 100% 0%; }
    75% { background-position: 0% 0%; }
    100% { background-position: 0% 50%; }
}

/* WATER DROPLETS (replaces bg-dots / blobs) */

.blob{
    position:fixed;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(187, 225, 250, 0.3), rgba(50, 130, 184, 0.2));
    backdrop-filter: blur(15px);
    border: 2px solid rgba(187, 225, 250, 0.4);
    animation: waterDrop 15s infinite ease-in-out, ripple 3s infinite ease-in-out;
    z-index:0;
    pointer-events:none;
    box-shadow:
        0 8px 32px rgba(15, 76, 117, 0.2),
        inset 0 0 20px rgba(187, 225, 250, 0.1);
}

@keyframes waterDrop{
    0%{ transform:translateY(0) rotate(0deg) scale(1); opacity: 0.7; }
    25%{ transform:translateY(-40px) rotate(90deg) scale(1.1); opacity: 0.9; }
    50%{ transform:translateY(-20px) rotate(180deg) scale(0.9); opacity: 0.8; }
    75%{ transform:translateY(-50px) rotate(270deg) scale(1.2); opacity: 0.6; }
    100%{ transform:translateY(0) rotate(360deg) scale(1); opacity: 0.7; }
}

@keyframes ripple {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 32px rgba(15, 76, 117, 0.2), inset 0 0 20px rgba(187, 225, 250, 0.1);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 12px 40px rgba(15, 76, 117, 0.3), inset 0 0 25px rgba(187, 225, 250, 0.15);
    }
}

.blob1{ width:140px; height:140px; top:8%; left:5%; }
.blob2{ width:90px; height:90px; bottom:10%; left:15%; }
.blob3{ width:180px; height:180px; top:15%; right:8%; }
.blob4{ width:100px; height:100px; bottom:12%; right:15%; }

/* MOBILE MENU TOGGLE */

.menu-btn{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  z-index:9999;
  background:rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  font-size:22px;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.menu-btn:hover{
  background:rgba(255,255,255,0.25);
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:220px;
  height:100%;

  background:
  linear-gradient(
      180deg,
      rgba(15, 76, 117, 0.9),
      rgba(50, 130, 184, 0.8),
      rgba(15, 76, 117, 0.9)
  );

  backdrop-filter: blur(25px);
  border-right: 2px solid rgba(187, 225, 250, 0.3);

  display:flex;
  flex-direction:column;
  align-items:stretch;
  padding:20px 15px;
  box-sizing:border-box;
  transition:.3s;
  z-index:100;
  color:white;

  box-shadow:
  0 8px 32px rgba(15, 76, 117, 0.3),
  inset 0 0 50px rgba(187, 225, 250, 0.1);
}

.brand{
  font-size:22px;
  font-weight:800;
  color:#bbe1fa;
  text-align:center;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-shadow: 0 2px 10px rgba(187, 225, 250, 0.5);
  width:100%;
  padding:16px 18px;
  border-radius:16px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

.sidebar button{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  margin:8px 0;
  border:none;
  border-radius:18px;
  background:rgba(255,255,255,0.08);
  color:#eff6ff;
  font-size:14px;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}

.sidebar button i{ width:18px; text-align:center; }

.sidebar button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
}

.sidebar button:hover::before { left: 100%; }

.sidebar button:hover{
  transform:translateX(8px) scale(1.02);
  background:rgba(255,255,255,0.2);
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.sidebar button.active{
  background: linear-gradient(135deg, rgba(56,189,248,0.3), rgba(14,165,233,0.3));
  border: 1px solid rgba(56,189,248,0.5);
  box-shadow: 0 0 20px rgba(56,189,248,0.3);
  color:#fff;
}

/* MAIN */

.main{
  margin-left:220px;
  min-height:100vh;
  position:relative;
  z-index:1;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(25px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.topbar h1{
  font-size:26px;
  color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,0.18);
}

.clock{
  padding:10px 18px;
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:999px;
  color:#fff;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* GLASS CARDS */

.card{
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius:24px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:
  0 20px 40px rgba(0,0,0,0.1),
  0 0 0 1px rgba(255,255,255,0.05) inset;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  color:#0f172a;
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.6s;
}

.card:hover::before { left: 100%; }

.card:hover{
  transform:translateY(-8px) scale(1.01);
  box-shadow:
  0 25px 50px rgba(0,0,0,0.15),
  0 0 0 1px rgba(255,255,255,0.1) inset,
  0 0 30px rgba(56,189,248,0.1);
}

.card h2{ color:#0f172a; margin-bottom:5px; }

.stat{
  text-align:center;
}
.stat h2{
  font-size:38px;
  color:#0f172a;
}
.stat p{
  margin-top:10px;
  color:#334155;
}

table{
  width:100%;
  border-collapse:collapse;
  color:#0f172a;
}
th,td{
  padding:14px;
  text-align:left;
}
th{
  background:rgba(14,165,233,0.18);
  color:#0f172a;
}
tr{
  background:rgba(255,255,255,0.8);
}
tr:hover{
  background:rgba(229,246,255,0.95);
}

/* BUTTONS */

.btn{
  padding:12px 18px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  font-weight:700;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn:hover{
  transform:translateY(-2px);
}
.blue{background:linear-gradient(90deg,#0ea5e9,#38bdf8);color:#fff;}
.green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;}
.orange{background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;}

/* STATUS */

.status{padding:8px 15px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block;}
.pending{background:#fff7ed;color:#f59e0b;}
.delivered{background:#ecfdf5;color:#22c55e;}
.prepare{background:#eff6ff;color:#3b82f6;}

.notify{padding:16px;border-radius:18px;background:rgba(255,255,255,0.36);margin:14px 0;color:#0f172a;backdrop-filter: blur(10px);}

/* INPUTS */

input, select, textarea{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  margin-top:10px;
  font-size:15px;
  outline:none;
  background:#f8fafc;
  color:#0f172a;
}

/* POPUPS */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.45);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:99999;
  backdrop-filter:blur(10px);
}
.popup-card{
  width:100%;
  max-width:520px;
  padding:30px;
  border-radius:24px;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.55);
  text-align:center;
  box-shadow:0 20px 60px rgba(15,23,42,0.18);
}

@media(max-width:768px){
  .menu-btn{display:block;}
  .sidebar{left:-100%;width:100%;height:auto;position:fixed;top:0;left:0;padding:20px 16px;}
  .sidebar.active{left:0;}
  .main{margin-left:0;padding-top:90px;}
  .topbar{flex-direction:column;align-items:flex-start;gap:10px;}
  .popup-card{width:90%;}
  .card{padding:18px;border-radius:18px;}
}

.bar-container{width:100%;height:18px;background:rgba(255,255,255,0.15);border-radius:20px;overflow:hidden;margin-top:10px;}
.bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#facc15,#f97316,#ef4444);transition:0.5s ease;border-radius:20px;}
.bar-text{margin-top:10px;font-size:14px;opacity:0.9;}

html{ -webkit-text-size-adjust:100%; }

.chat-btn{

    position:fixed;

    right:25px;
    bottom:90px;

    width:65px;
    height:65px;

    border:none;

    border-radius:50%;

    background:
    linear-gradient(
        90deg,
        #0ea5e9,
        #38bdf8
    );

    color:white;

    font-size:24px;

    cursor:pointer;

    z-index:9999;
}

.chat-box{

    position:fixed;

    right:25px;
    bottom:165px;

    width:340px;
    height:420px;

    background:white;

    border-radius:28px;

    overflow:hidden;

    display:none;
    flex-direction:column;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.18);

    z-index:9999;
}

.chat-header{

    padding:18px;

    background:
    linear-gradient(
        90deg,
        #0ea5e9,
        #38bdf8
    );

    color:white;
    font-weight:700;
}

.chat-body{

    flex:1;

    padding:15px;

    overflow-y:auto;

    background:#f8fafc;
}

.chat-input{
    display:flex;
}

.chat-input input{

    margin:0;
    border-radius:0;
}

.chat-input button{

    width:90px;

    border:none;

    background:#0ea5e9;

    color:white;
}

.ai-msg{
    box-shadow:
    0 4px 15px rgba(14,165,233,0.15);
}

.user-msg{
    box-shadow:
    0 4px 15px rgba(0,0,0,0.08);
}

@media(max-width:768px){
  .chat-box{ right:5%; bottom:130px; width:90%; height:60vh; }
  .chat-btn{ right:15px; bottom:90px; }
}

button, input, select, textarea{ font-size:16px; }

</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
function notify(text){
  const d = document.createElement('div');
  d.className = 'notify';
  d.style.position = 'fixed';
  d.style.top = '20px';
  d.style.right = '20px';
  d.style.zIndex = 99999;
  d.innerHTML = text;
  document.body.appendChild(d);
  setTimeout(()=>{ d.remove(); },3000);
}

function openAttendanceGenerator(){
  const modal = document.createElement('div');
  modal.className = 'popup-overlay';
  modal.id = 'attendanceGen';
  modal.style.display = 'flex';

  const riderOptions = ridersList.map(r => `<option value="${r.id}">${r.name} (${r.id})</option>`).join('');

  modal.innerHTML = `
    <div class="popup-card">
      <h2>📷 Generate Attendance QR</h2>
      <br>
      <select id="attendanceRider">${riderOptions}</select>
      <br><br>
      <div id="attendanceQrHolder" style="margin-top:12px;text-align:center"></div>
      <br>
      <button class="btn green" onclick="generateAttendanceQR()">Generate QR</button>
      <button class="btn orange" onclick="closeAttendanceGenerator()">Close</button>
    </div>
  `;

  document.body.appendChild(modal);
}

function closeAttendanceGenerator(){
  const m = document.getElementById('attendanceGen'); if(m) m.remove();
}

async function generateAttendanceQR(){
  const riderId = document.getElementById('attendanceRider').value;
  if(!riderId) return alert('Select a rider');

  const payload = `attendance|${riderId}`;

  try{
    const dataUrl = await QRCode.toDataURL(payload, { width: 280 });
    document.getElementById('attendanceQrHolder').innerHTML = `<img src="${dataUrl}" style="width:280px;height:280px;"/>` +
      `<br><a class="btn blue" href="${dataUrl}" download="attendance-${riderId}-${Date.now()}.png">Download</a>`;
    const gen = JSON.parse(localStorage.getItem('generatedAttendance')||'[]');
    gen.push({ riderId, time:new Date().toISOString(), dataUrl });
    localStorage.setItem('generatedAttendance', JSON.stringify(gen));
    notify('✅ Attendance QR generated');
  }catch(e){ console.error(e); alert('Failed to generate QR'); }
}

function showAttendanceLogs(){
  const attendance = JSON.parse(localStorage.getItem('attendance')||'{}');
  let html = `<div class="card"><h2>📋 Attendance Logs</h2>`;
  for(const riderId in attendance){
    html += `<h3>${riderId}</h3><table>`;
    html += `<tr><th>Date</th><th>Time</th><th>Status</th></tr>`;
    const entries = attendance[riderId];
    for(const d in entries){
      html += `<tr><td>${d}</td><td>${entries[d].loginTime}</td><td>${entries[d].status}</td></tr>`;
    }
    html += `</table>`;
  }
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}
</script>

</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<button class="menu-btn" onclick="toggleSidebar()">
☰
</button>

<div id="attendancePopup" class="popup-overlay">
<div class="popup-card">
<h2>🗓️ Attendance Confirmation</h2>
<br>
<p id="attendanceDate"></p>

<br>

✅ I Am Present
</button>

</div>

<div id="logoutPopup" class="popup-overlay">
<div class="popup-card">
<h2>🚪 Logout Confirmation</h2>
<br>
<p id="logoutDate"></p>
<p id="logoutTime"></p>
<br>
<button class="btn orange" onclick="confirmLogout()">
📁 Confirm Log Out
</button>
</div>
</div>

<div class="sidebar">
<div class="brand">
🏢 MANAGER
</div>
<button onclick="dashboard()">🏠 Dashboard</button>
<button onclick="inventory()">📦 Inventory</button>
<button onclick="riderPerformance()">🏍️ Rider Performance</button>
<button onclick="showNotifications()">🔔 Notifications</button>
<button onclick="showCustomerAccounts()">👤 Customer Accounts</button>
<button onclick="openAttendanceGenerator()">🧾 Attendance QR</button>
<button onclick="reports()">📄 Reports</button>
<button onclick="showLogoutPopup()">🚪 Log Out</button>
</div>

<div class="main">
<div class="topbar">
<h1>Manager Dashboard</h1>
<div class="clock" id="clock"></div>
</div>
<div id="content"></div>
</div>

<div id="reportPopup" class="popup-overlay">
<div class="popup-card">
<h2>📄 Create Report</h2>
<br>
<input id="repRefilled" type="number" placeholder="Total Gallons Refilled">
<input id="repSold" type="number" placeholder="Total Gallons Sold">
<input id="repUnsold" type="number" placeholder="Total Gallons Unsold">
<input id="repReason" type="text" placeholder="Reason">
<br><br>
<button class="btn green" onclick="saveReport()">💾 Save Report</button>
<br><br>
<button class="btn orange" onclick="closeReportForm()">✖ Close</button>
</div>
</div>

<button class="chat-btn" onclick="toggleManagerFAQ()">
  <i class="fa fa-robot"></i>
</button>

<div class="chat-box" id="managerFaqBox">
  <div class="chat-header">Manager AI Assistant</div>
  <div class="chat-body" id="managerFaqBody">
    <p><b>AI:</b> Ask me about inventory, attendance, notifications, reports, or rider performance.</p>
  </div>
  <div class="chat-input">
    <input id="managerFaqInput" placeholder="Ask AI anything..." onkeypress="if(event.key==='Enter') sendManagerFAQ()">
    <button class="btn blue" onclick="sendManagerFAQ()">Send</button>
  </div>
</div>

<script>

function openReportForm(){
document.getElementById("reportPopup").style.display = "flex";
}

function closeReportForm(){
document.getElementById("reportPopup").style.display = "none";
}

function saveReport(){
let refilled = parseFloat(document.getElementById("repRefilled").value);
let sold = parseFloat(document.getElementById("repSold").value);
let unsold = parseFloat(document.getElementById("repUnsold").value);
let reason = document.getElementById("repReason").value;

if(isNaN(refilled) || isNaN(sold) || isNaN(unsold) || reason.trim() === ""){
alert("Please complete all fields");
return;
}

let report = {
date: new Date().toLocaleString(),
refilled,
sold,
unsold,
reason
};

reportsList.push(report);
localStorage.setItem("reportsList", JSON.stringify(reportsList));
closeReportForm();
reports();
}

function getAttendance(){
  return JSON.parse(localStorage.getItem("attendance")) || {};
}

function saveAttendance(data){
  localStorage.setItem("attendance", JSON.stringify(data));
}

function showCustomerAccounts(){
  const users = JSON.parse(localStorage.getItem("users")) || [];
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2>👥 Registered Customer Accounts</h2>
      <p>${users.length} account${users.length === 1 ? "" : "s"} found</p>
      <br>
      ${users.length === 0 ? '<div class="notify">No registered customers found.</div>' : `
        <table>
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Secondary Email</th>
            <th>Role</th>
          </tr>
          ${users.map((user, index) => `
            <tr>
              <td>${index + 1}</td>
              <td>${user.fname || "-"}</td>
              <td>${user.lname || "-"}</td>
              <td>${user.username || "-"}</td>
              <td>${user.email || "-"}</td>
              <td>${user.email2 || "-"}</td>
              <td>${user.role || "customer"}</td>
            </tr>
          `).join("")}
        </table>
      `}
    </div>
  `;
}

let ridersList = [
  { id: "r1", name: "Rider John" },
  { id: "r2", name: "Rider Mike" }
];

function riderPerformance(){

  const totalRiders = ridersList.length;
  const activeRiders = 2;
  const lateRiders = 1;

  document.getElementById("content").innerHTML = `

    <div class="grid">
      <div class="card stat">
        <h2>${totalRiders}</h2>
        <p>Total Riders</p>
      </div>
      <div class="card stat">
        <h2>${activeRiders}</h2>
        <p>Active Riders</p>
      </div>
      <div class="card stat">
        <h2>${lateRiders}</h2>
        <p>Late Riders</p>
      </div>
    </div>

    <div class="card">
      <h2>🏍️ Rider Performance</h2>
      <p>Select a rider to view full performance</p>
      <br>
      ${ridersList.map(r=>`
        <div class="notify"
          style="cursor:pointer"
          onclick="openRider(${JSON.stringify(r).replace(/"/g,'&quot;')})">
          👤 ${r.name}
        </div>
      `).join("")}
    </div>
  `;
}

function openRider(rider){

  const orders = [
    { name:"Juan Dela Cruz", address:"Blk 1 Lot 2 Caloocan City", status:"Delivered", total:120, rider:"Rider John" },
    { name:"Maria Santos", address:"blk3 lot4 Caloocan City", status:"Pending", total:80, rider:"Rider John" },
    { name:"Pedro Reyes", address:"Urduja Caloocan City", status:"Delivered", total:150, rider:"Rider John" },
    { name:"Ana Lopez", address:"Blk1 Lot2 Urduja Caloocan City", status:"Pending", total:200, rider:"Rider Mike" },
    { name:"Carlo Ramos", address:"Urduja Caloocan City", status:"Delivered", total:175, rider:"Rider Mike" },
    { name:"Liza Cruz", address:"Caloocan Urduja City", status:"Delivered", total:140, rider:"Rider Mike" }
  ];

  const riderOrders = orders.filter(o => o.rider === rider.name);

function editInventoryLog(id){
  let log = inventoryLogs.find(l => l.id === id);
  if(!log) return;

  const currentValue = log.totalInput ?? log.sold ?? 0;
  const userInput = prompt("Enter new total gallons for this record:", currentValue);
  if(userInput === null) return;

  const sold = parseFloat(userInput);
  if(isNaN(sold) || sold <= 0){
    alert("Invalid input");
    return;
  }

  log.totalInput = sold;
  if(log.sold !== undefined) log.sold = sold;
  log.impact = Number((-(sold * 0.005)).toFixed(2));
  log.status = "Edited";
  log.editRequested = false;
  log.approved = true;

  localStorage.setItem("inventoryLogs", JSON.stringify(inventoryLogs));
  inventory();
}

  totalInput: sold,

  status: "Approved",
  editRequested: false,

gallons += sold;
totalGallonsSold += sold;
filterLife = Math.max(0, filterLife - sold * 0.005);

localStorage.setItem("inventoryLogs", JSON.stringify(inventoryLogs));
localStorage.setItem("gallons", gallons);

function approveNotification(id){
  notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  let notif = notifications.find(n => n.id == id);
  if(!notif) return;
  notif.status = "Approved";

  if((notif.type === "edit-request" || notif.type === "inventory-add") && notif.logId != null){
    let log = inventoryLogs.find(l => l.id == notif.logId);
    if(log){
      log.editRequested = false;
      log.status = "Approved";
      log.approved = true;
      localStorage.setItem("inventoryLogs", JSON.stringify(inventoryLogs));

      if(notif.type === "inventory-add"){
        gallons += log.totalInput;
        totalGallonsSold += log.totalInput;
        filterLife = Math.max(0, filterLife - log.totalInput * 0.005);
        localStorage.setItem("gallons", gallons);
        localStorage.setItem("totalGallonsSold", totalGallonsSold);
        localStorage.setItem("filterLife", filterLife);
      }
    }
    notify("Stock request approved ✅");
  } else if (notif.type === "leave-request") {
    notify("Leave request approved ✅");
  } else {
    notify("Attendance Approved ✅");
  }

  localStorage.setItem("notifications", JSON.stringify(notifications));
  showNotifications();
}

function rejectNotification(id){
  notifications = JSON.parse(localStorage.getItem("notifications")) || [];
  let notif = notifications.find(n => n.id == id);
  if(!notif) return;
  notif.status = "Rejected";

  if((notif.type === "edit-request" || notif.type === "inventory-add") && notif.logId != null){
    let log = inventoryLogs.find(l => l.id == notif.logId);
    if(log){
      log.editRequested = false;
      log.status = "Rejected";
      log.approved = false;
      localStorage.setItem("inventoryLogs", JSON.stringify(inventoryLogs));
    }
    notify("Stock request rejected ❌");
  } else if (notif.type === "leave-request") {
    notify("Leave request rejected ❌");
  } else {
    notify("Attendance Rejected ❌");
  }

  localStorage.setItem("notifications", JSON.stringify(notifications));
  showNotifications();
}

  }
];

function generateManagerRAGResponse(message){
  const msg = message.toLowerCase();

  if(msg.includes('inventory') || msg.includes('stock') || msg.includes('gallon')){
    return `📦 Inventory Assistant\n\nCurrent stock: ${gallons} gallons available. Filter life is at ${filterLife.toFixed(2)}%. Use Inventory for new stock entries and reports.`;
  }

  if(msg.includes('attendance') || msg.includes('present') || msg.includes('login')){
    return '🧾 Attendance Assistant\n\nUse the Attendance QR generator or Rider Performance to review staff attendance records.';
  }

  if(msg.includes('notification') || msg.includes('approve') || msg.includes('reject')){
    return '🔔 Notification Assistant\n\nOpen Notifications to review approval requests and manage inventory/attendance actions.';
  }

  if(msg.includes('report') || msg.includes('reports')){
    return '📄 Reports Assistant\n\nUse the Create Report button to log refilled, sold, and unsold gallons along with a reason.';
  }

  if(msg.includes('rider') || msg.includes('delivery') || msg.includes('performance')){
    return '🏍️ Rider Assistant\n\nGo to Rider Performance to see rider order counts, delivered status, and performance details.';
  }

  if(msg.includes('help') || msg.includes('hi') || msg.includes('hello')){
    return '🤖 Manager AI\n\nAsk me about inventory, attendance, notifications, reports, or rider performance.';
  }

  let bestMatch = null;
  let highestScore = 0;

  managerKnowledgeBase.forEach(item => {
    let score = 0;
    item.keywords.forEach(keyword => {
      if(msg.includes(keyword)) score += 2;
      if(keyword.startsWith(msg.slice(0,3))) score += 1;
    });
    if(score > highestScore){
      highestScore = score;
      bestMatch = item;
    }
  });

  if(bestMatch){
    return `🤖 Manager AI\n\n${bestMatch.response}`;
  }

  return '🤖 Manager AI\n\nI didn\'t quite catch that. Try asking about inventory, attendance, notifications, reports, or rider performance.';
}

function appendManagerMessage(sender, text){
  const body = document.getElementById('managerFaqBody');
  const bubbleClass = sender === 'AI' ? 'ai-msg' : 'user-msg';

  body.innerHTML += `\n    <div class="${bubbleClass}" style="animation:fadeIn .3s ease;">\n      <b>${sender}:</b><br>${text}\n    </div>\n`;
  body.scrollTop = body.scrollHeight;
}

function appendManagerTyping(){
  const body = document.getElementById('managerFaqBody');
  body.innerHTML += `\n    <div id="managerTypingBubble" style="background:#e2e8f0;padding:10px 15px;border-radius:18px;width:90px;">\n      🤖 typing...\n    </div>\n`;
  body.scrollTop = body.scrollHeight;
}

function removeManagerTyping(){
  const bubble = document.getElementById('managerTypingBubble');
  if(bubble) bubble.remove();
}
