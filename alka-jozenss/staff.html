<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAFF DASHBOARD</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#0f4c75 0%,#3282b8 25%,#bbe1fa 50%,#3282b8 75%,#0f4c75 100%);
background-size:400% 400%;
animation:waterFlow 20s ease infinite;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}
@keyframes waterFlow{
0%{background-position:0% 50%;}
25%{background-position:100% 50%;}
50%{background-position:100% 0%;}
75%{background-position:0% 0%;}
100%{background-position:0% 50%;}
}

/* BUBBLES */
.bubble{
position:fixed;border-radius:50%;
background:linear-gradient(135deg,rgba(187,225,250,0.3),rgba(50,130,184,0.2));
backdrop-filter:blur(15px);
border:2px solid rgba(187,225,250,0.4);
animation:waterDrop 15s infinite ease-in-out;
z-index:0;pointer-events:none;
}
@keyframes waterDrop{
0%{transform:translateY(0) scale(1);opacity:.7;}
50%{transform:translateY(-40px) scale(1.1);opacity:1;}
100%{transform:translateY(0) scale(1);opacity:.7;}
}

/* SIDEBAR */
.sidebar{
width:260px;height:100vh;position:fixed;padding:20px;
background:rgba(15,76,117,0.9);
backdrop-filter:blur(25px);
border-right:1px solid rgba(255,255,255,0.2);
z-index:10;
display:flex;flex-direction:column;
}
.brand{font-size:24px;font-weight:bold;color:#bbe1fa;text-align:center;margin-bottom:30px;}
.sidebar button{
width:100%;padding:16px;margin:10px 0;border:none;border-radius:16px;
background:rgba(255,255,255,0.08);color:white;cursor:pointer;
font-size:15px;transition:.3s;text-align:left;
}
.sidebar button:hover{background:rgba(255,255,255,0.18);transform:translateX(5px);}
.sidebar button.active{background:rgba(187,225,250,0.2);border:1px solid rgba(187,225,250,0.4);}
.sidebar button.logout-btn{
margin-top:auto;background:rgba(239,68,68,0.3);border:1px solid rgba(239,68,68,0.5);
}
.sidebar button.logout-btn:hover{background:rgba(239,68,68,0.5);}

/* MAIN */
.main{margin-left:260px;padding:30px;width:100%;position:relative;z-index:1;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:10px;flex-wrap:wrap;}
.topbar h1{font-size:32px;color:#bbe1fa;}
.clock{padding:14px 20px;border-radius:16px;background:rgba(255,255,255,0.08);backdrop-filter:blur(15px);}

/* GRID / CARD */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{
background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);
border-radius:22px;padding:25px;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 30px rgba(0,0,0,0.2);
transition:.3s;
}
.card:hover{transform:translateY(-5px);}
.stat{text-align:center;}
.stat h2{font-size:40px;color:#bbe1fa;}
.stat p{margin-top:10px;color:#dbeafe;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:16px;}
th,td{padding:16px;text-align:left;}
th{background:rgba(15,76,117,0.5);color:#bbe1fa;}
tr{background:rgba(255,255,255,0.05);}
tr:hover{background:rgba(255,255,255,0.1);}
tr.clickable{cursor:pointer;}

/* STATUS */
.status{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap;}
.pending{background:#f59e0b;}
.delivered{background:#22c55e;}
.ontime{background:#3b82f6;}
.cancelled{background:#ef4444;}

.notify{padding:18px;margin:12px 0;border-radius:14px;background:rgba(255,255,255,0.08);}

/* BUTTON */
.btn{
padding:12px 20px;border:none;border-radius:14px;background:#3b82f6;color:white;
cursor:pointer;font-weight:bold;transition:.3s;
}
.btn:hover{transform:scale(1.05);}
.btn.red{background:#ef4444;}
.btn.green{background:#22c55e;}

.field,.select{
padding:12px 14px;border:none;border-radius:12px;background:#0f4c75;color:white;
font-size:15px;outline:none;
}
.field::placeholder{color:#a0d8ff;}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
.toolbar .field{flex:1;min-width:200px;}

/* SCANNER */
.scan-layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:stretch;}
.scan-layout .card{
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  box-shadow: 0 24px 50px rgba(15, 76, 117, 0.18);
}
.viewfinder{
position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;
background:rgba(0,0,0,0.35);border:1px solid rgba(187,225,250,0.4);
display:flex;align-items:center;justify-content:center;
}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:none;}
.viewfinder.live video{display:block;}
.viewfinder .placeholder{text-align:center;color:#bbe1fa;padding:20px;}
.viewfinder .placeholder span{font-size:60px;display:block;margin-bottom:10px;}
.viewfinder.live .placeholder{display:none;}
.frame{
position:absolute;inset:18%;border:3px solid #bbe1fa;border-radius:18px;display:none;
box-shadow:0 0 0 999px rgba(15,76,117,0.35);
}
.viewfinder.live .frame{display:block;}
.laser{
position:absolute;left:18%;right:18%;height:2px;background:#22c55e;display:none;
box-shadow:0 0 12px #22c55e;animation:laser 2s infinite ease-in-out;
}
.viewfinder.live .laser{display:block;}
@keyframes laser{0%{top:20%;}50%{top:78%;}100%{top:20%;}}
.scan-result{
padding:18px;margin-top:16px;border-radius:14px;background:rgba(255,255,255,0.08);
border-left:5px solid #3b82f6;
}
.scan-result.ok{border-left-color:#22c55e;background:rgba(34,197,94,0.18);}
.scan-result.warn{border-left-color:#f59e0b;background:rgba(245,158,11,0.18);}
.scan-result.err{border-left-color:#ef4444;background:rgba(239,68,68,0.18);}
.progress{height:14px;border-radius:10px;background:rgba(255,255,255,0.15);overflow:hidden;margin-top:10px;}
.progress div{height:100%;background:#22c55e;transition:.4s;}
.detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);gap:10px;}
.detail-row:last-child{border-bottom:none;}
.detail-row span:first-child{color:#bbe1fa;}

/* QR VERIFICATION PANEL */
.staff-qr-panel{
  max-width:430px;margin:0 auto;padding:30px 28px;text-align:center;
  background:rgba(236,246,255,0.98);color:#0f172a;border:1px solid rgba(255,255,255,0.7);
  border-radius:32px;box-shadow:0 28px 70px rgba(16,80,139,0.18);
}
.staff-qr-step{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:4px 12px;
  border:1px solid rgba(56,189,248,0.3);border-radius:20px;background:rgba(56,189,248,0.14);
  color:rgba(13,52,96,0.55);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
}
.staff-qr-panel h3{margin-bottom:6px;color:#0f172a;font-size:20px;}
.staff-qr-subtitle{margin-bottom:16px;color:#1e4976;font-size:13px;font-weight:600;line-height:1.6;}
.staff-qr-panel .viewfinder{
  width:320px;max-width:100%;height:260px;margin:0 auto;border:0;border-radius:18px;
  background:rgba(13,52,96,0.05);
}
.staff-qr-panel .viewfinder .placeholder{color:#1e4976;}
.staff-qr-panel .viewfinder .placeholder span{color:#38bdf8;}
.staff-qr-tip{
  margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(56,189,248,0.12);
  color:#0d3460;font-size:12px;font-weight:700;line-height:1.5;
}
.staff-qr-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px;}
.staff-qr-panel .btn{border-radius:14px;box-shadow:none;}
.staff-qr-panel .btn.green{background:linear-gradient(135deg,#38bdf8,#0284c7);}
.staff-qr-panel .btn.secondary{background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.85);color:#0d3460;}
.staff-qr-panel .scan-result{min-height:18px;margin-top:12px;padding:0;border:0;background:transparent;color:#0d3460;font-weight:800;}
.staff-qr-panel .scan-result.ok{color:#16a34a;background:transparent;}
.staff-qr-panel .scan-result.warn{color:#b45309;background:transparent;}
.staff-qr-panel .scan-result.err{color:#ef4444;background:transparent;}
@media(max-width:768px){
  .staff-qr-panel{padding:22px 18px;border-radius:22px;}
  .staff-qr-panel .viewfinder{height:240px;}
}

/* LOGIN */
.admin-login-overlay{
  position:fixed;inset:0;background:linear-gradient(135deg,#0d6ea8 0%,#1c90cf 35%,#67c5ea 100%);
  display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;
}

.app-shell{
  width:min(1220px, calc(100vw - 90px));
  height:min(820px, calc(100vh - 72px));
  display:flex;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.28);
  border-radius:32px;
  box-shadow:0 20px 50px rgba(7,70,110,0.25);
  overflow:hidden;
}

.login-sidebar{
  width:280px;
  min-width:280px;
  background:linear-gradient(180deg, rgba(10,97,152,0.95), rgba(33,128,188,0.9));
  border-right:1px solid rgba(255,255,255,0.18);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 24px 18px;
  position:relative;
}

.logo-badge{
  width:96px;height:96px;border-radius:24px;
  background:rgba(255,255,255,0.18);backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center;
  font-size:54px; margin-top:8px; box-shadow:inset 0 0 25px rgba(255,255,255,0.1);
}

.brand-title{
  margin-top:20px; font-size:20px; font-weight:700; color:#edf9ff; text-align:center; letter-spacing:0.4px;
}
.brand-subtitle{
  margin-top:4px; font-size:12px; color:#d8effa; opacity:0.9; text-align:center;
}

.nav-pill{
  width:100%; margin-top:34px; padding:18px 18px; border-radius:15px; border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.08); color:#f1fbff; font-size:18px; font-weight:600;
  display:flex;align-items:center;justify-content:flex-start;gap:10px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
}

.sidebar-arrow{
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
  width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:42px; font-weight:300; display:flex; align-items:center; justify-content:center;
}

.login-panel{
  flex:1;background:linear-gradient(180deg, rgba(121,190,230,0.76), rgba(121,190,230,0.82));
  padding:30px 38px 28px;
  position:relative;
}

.login-header{
  display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 10px 14px; border-bottom:1px solid rgba(255,255,255,0.35);
}

.login-header h1{
  font-size:26px; color:#ffffff; font-weight:600; margin:0;
}

.time-pill{
  padding:10px 18px; min-width:120px; text-align:center; border-radius:14px;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#eff9ff; font-weight:700; font-size:14px;
  letter-spacing:0.4px;
}

.login-card{
  width:min(520px, calc(100% - 80px));
  margin:110px auto 0;
  background:rgba(225,240,250,0.18);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:28px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.2), 0 12px 32px rgba(18,94,147,0.12);
  padding:28px 26px 26px;
  backdrop-filter:blur(6px);
}

.login-card h2{
  text-align:center; font-size:28px; color:#ffffff; margin:0 0 8px; font-weight:800; letter-spacing:0.5px;
}
.login-card p{ text-align:center; color:rgba(239,248,255,0.9); margin-bottom:22px; font-size:14px; }

.login-field{
  position:relative; display:flex; align-items:center; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.2);
  border-radius:16px; margin-bottom:16px; padding:0 18px;height:58px; overflow:hidden;
}
.login-field span{ font-size:20px; color:#f2fbff; min-width:26px; display:inline-flex; align-items:center; justify-content:center; }
.login-field input{
  width:100%; border:none; background:transparent; outline:none; color:#fff; font-size:20px; padding-left:14px;
}
.login-field input::placeholder{ color:rgba(255,255,255,0.7); }

.login-btn{
  width:100%; height:58px; border:none; border-radius:16px; margin-top:6px; background:linear-gradient(135deg,#1fa5ee 0%,#0d9ce9 100%);
  color:#fff; font-size:18px; font-weight:700; box-shadow:0 8px 18px rgba(11,112,173,0.28); cursor:pointer;
}

@media(max-width:768px){
  .app-shell{ width:100%; height:auto; min-height:100vh; border-radius:0; }
  body{flex-direction:column;}
  .login-sidebar{ width:100%; min-width:0; border-right:none; border-bottom:1px solid rgba(255,255,255,0.18); padding-bottom:26px; }
  .login-panel{ padding:20px 16px 24px; }
  .login-header{ padding-bottom:12px; }
  .login-card{ width:100%; margin-top:48px; }
  .login-field input{ font-size:18px; }
}
</style>
</head>
<body>

<!-- STAFF LOGIN -->
<div id="staffLoginOverlay" class="admin-login-overlay">
  <div class="app-shell">
    <aside class="login-sidebar">
      <div class="logo-badge">💧</div>
      <div class="brand-title">Alka-Jozen</div>
      <div class="brand-subtitle">Pure Water Delivery</div>

      <div class="nav-pill">🔐 Login</div>
      <div class="sidebar-arrow">›</div>
    </aside>

    <main class="login-panel">
      <div class="login-header">
        <h1>Login</h1>
        <div class="time-pill" id="loginClock">5:23:49 PM</div>
      </div>

      <div class="login-card">
        <h2>Staff Login</h2>
        <p>Sign in to continue</p>

        <div class="login-field">
          <span>👤</span>
          <input id="staffLoginUsername" type="text" placeholder="Username">
        </div>

        <div class="login-field">
          <span>🔒</span>
          <input id="staffLoginPassword" type="password" placeholder="Password">
        </div>

        <button class="login-btn" onclick="staffLogin()">Login</button>
      </div>
    </main>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar" style="display:none;">
<div class="brand">💧 STAFF DASHBOARD</div>
<button id="nav-orders" onclick="viewOrders()">📦 View Orders</button>
<button id="nav-scan" onclick="scanQR()">📷 Scan Gallon QR</button>
<button id="nav-history" onclick="scanHistory()">🧾 Scan History</button>
<button class="logout-btn" onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main" id="main" style="display:none;">
<div class="topbar">
<h1>Staff Operations</h1>
<div class="clock" id="clock"></div>
</div>
<div id="content"></div>
</div>

<script>
/* ================= HELPERS ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setActive(id){
  document.querySelectorAll(".sidebar button").forEach(b => b.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
}
function statusClass(s){
  return ({
    "Pending":"pending",
    "Out for Delivery":"ontime",
    "Delivered":"delivered",
    "Cancelled":"cancelled"
  })[s] || "pending";
}
function load(key, fallback){
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

/* ================= LOGIN MANAGEMENT ================= */
function showApp(){
  document.getElementById("staffLoginOverlay").style.display = "none";
  document.getElementById("sidebar").style.display = "flex";
  document.getElementById("main").style.display = "block";
  viewOrders();
}
function staffLogin(){
  const user = document.getElementById("staffLoginUsername").value.trim();
  const pass = document.getElementById("staffLoginPassword").value.trim();
  if (!user || !pass){ alert("Please enter both the username and password."); return; }

  if (user === "staff" && pass === "staff123"){
    localStorage.setItem("staffLoggedIn","true");
    localStorage.setItem("userType","staff");
    localStorage.setItem("currentUser", JSON.stringify({username:"staff", role:"staff", fname:"Staff"}));
    showApp();
  } else {
    alert("Invalid staff credentials.");
  }
}
function logout(){
  stopCamera();
  localStorage.removeItem("staffLoggedIn");
  localStorage.removeItem("userType");
  localStorage.removeItem("currentUser");
  document.getElementById("sidebar").style.display = "none";
  document.getElementById("main").style.display = "none";
  document.getElementById("staffLoginOverlay").style.display = "flex";
  document.getElementById("staffLoginUsername").value = "";
  document.getElementById("staffLoginPassword").value = "";
}
window.addEventListener("load", function(){
  const loginClock = document.getElementById("loginClock");
  if (loginClock) {
    const formatClock = () => {
      const now = new Date();
      const formatted = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true});
      loginClock.textContent = formatted.toUpperCase();
    };
    formatClock();
    setInterval(formatClock, 1000);
  }

  if (localStorage.getItem("staffLoggedIn") === "true") showApp();
  const staffPasswordInput = document.getElementById("staffLoginPassword");
  if (staffPasswordInput) {
    staffPasswordInput.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); staffLogin(); }
    });
  }
});

/* CLOCK */
setInterval(()=>{
  const clock = document.getElementById("clock");
  if (clock) clock.innerHTML = new Date().toLocaleTimeString();
},1000);

/* ================= DATA ================= */
/* Orders: replace with your real orders source (shared "orders" key in localStorage is used if present) */
const sampleOrders = [
 {id:"ORD-1001", customer:"Maria Santos",  address:"Blk 4 Lot 12, Sta. Maria",   phone:"0917 123 4567", gallons:5, total:300, status:"Pending",          rider:"-",          time:"8:15 AM",  payment:"Cash on Delivery"},
 {id:"ORD-1002", customer:"Pedro Reyes",   address:"22 Rizal St., Marilao",       phone:"0918 222 3344", gallons:3, total:180, status:"Out for Delivery", rider:"Juan Rider", time:"8:40 AM",  payment:"GCash"},
 {id:"ORD-1003", customer:"Ana Dela Cruz", address:"15 Mabini Ave., Meycauayan",  phone:"0920 555 7788", gallons:10,total:600, status:"Delivered",        rider:"Mark Rider", time:"9:05 AM",  payment:"Cash on Delivery"},
 {id:"ORD-1004", customer:"Jose Ramirez",  address:"Purok 3, Bocaue",             phone:"0926 111 9090", gallons:2, total:120, status:"Pending",          rider:"-",          time:"9:30 AM",  payment:"GCash"},
 {id:"ORD-1005", customer:"Liza Mercado",  address:"88 Sampaguita St., Balagtas", phone:"0915 808 4321", gallons:4, total:240, status:"Delivered",        rider:"Juan Rider", time:"10:10 AM", payment:"Cash on Delivery"},
 {id:"ORD-1006", customer:"Carlo Bautista",address:"Blk 9, Guiguinto",            phone:"0917 909 1212", gallons:6, total:360, status:"Cancelled",        rider:"-",          time:"10:45 AM", payment:"GCash"}
];
function getOrders(){
  const stored = load("orders", null);
  return Array.isArray(stored) && stored.length ? stored : sampleOrders;
}

/* Gallon QR scans. Accepted QR format: GAL-#### (e.g. GAL-0042) */
let scans = load("staffScans", []);
let activeOrderId = localStorage.getItem("staffActiveOrder") || "";

/* ================= VIEW ORDERS ================= */
let orderFilter = "All";
let orderSearch = "";

function viewOrders(){
  stopCamera();
  setActive("nav-orders");
  const orders = getOrders();
  const count = s => orders.filter(o => o.status === s).length;

  document.getElementById("content").innerHTML = `
  <div class="grid">
    <div class="card stat"><h2>${orders.length}</h2><p>Total Orders</p></div>
    <div class="card stat"><h2>${count("Pending")}</h2><p>Pending</p></div>
    <div class="card stat"><h2>${count("Out for Delivery")}</h2><p>Out for Delivery</p></div>
    <div class="card stat"><h2>${count("Delivered")}</h2><p>Delivered</p></div>
  </div>
  <br>
  <div class="card">
    <h3>📦 Customer Orders</h3>
    <br>
    <div class="toolbar">
      <input class="field" id="orderSearch" placeholder="Search order ID or customer..." value="${esc(orderSearch)}" oninput="orderSearch=this.value; renderOrderRows()">
      <select class="select" id="orderFilter" onchange="orderFilter=this.value; renderOrderRows()">
        ${["All","Pending","Out for Delivery","Delivered","Cancelled"].map(s =>
          `<option ${s===orderFilter?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Order ID</th><th>Customer</th><th>Gallons</th><th>Total</th><th>Time</th><th>Status</th>
        </tr></thead>
        <tbody id="orderRows"></tbody>
      </table>
    </div>
  </div>
  <div id="orderDetails"></div>
  `;
  renderOrderRows();
}

function renderOrderRows(){
  const q = orderSearch.trim().toLowerCase();
  const rows = getOrders().filter(o =>
    (orderFilter === "All" || o.status === orderFilter) &&
    (!q || o.id.toLowerCase().includes(q) || o.customer.toLowerCase().includes(q))
  );
  const tbody = document.getElementById("orderRows");
  if (!tbody) return;
  tbody.innerHTML = rows.length ? rows.map(o => `
    <tr class="clickable" onclick="openOrder('${esc(o.id)}')">
      <td>${esc(o.id)}</td>
      <td>${esc(o.customer)}</td>
      <td>${esc(o.gallons)}</td>
      <td>₱${Number(o.total).toLocaleString()}</td>
      <td>${esc(o.time)}</td>
      <td><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></td>
    </tr>`).join("") :
    `<tr><td colspan="6" style="text-align:center;">No orders found.</td></tr>`;
}

function scannedFor(orderId){
  return scans.filter(s => s.orderId === orderId);
}

function openOrder(id){
  const o = getOrders().find(x => x.id === id);
  if (!o) return;
  const done = scannedFor(o.id).length;
  const pct = Math.min(100, Math.round(done / o.gallons * 100));
  const box = document.getElementById("orderDetails");
  box.innerHTML = `
  <br>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3>🧾 ${esc(o.id)} Details</h3>
      <span class="status ${statusClass(o.status)}">${esc(o.status)}</span>
    </div>
    <br>
    <div class="detail-row"><span>Customer</span><span>${esc(o.customer)}</span></div>
    <div class="detail-row"><span>Phone</span><span>${esc(o.phone || "-")}</span></div>
    <div class="detail-row"><span>Address</span><span>${esc(o.address)}</span></div>
    <div class="detail-row"><span>Gallons Ordered</span><span>${esc(o.gallons)}</span></div>
    <div class="detail-row"><span>Total</span><span>₱${Number(o.total).toLocaleString()}</span></div>
    <div class="detail-row"><span>Payment</span><span>${esc(o.payment || "-")}</span></div>
    <div class="detail-row"><span>Rider</span><span>${esc(o.rider || "-")}</span></div>
    <br>
    <p>Gallons scanned: <b>${done} / ${esc(o.gallons)}</b></p>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <br>
    <button class="btn" onclick="scanForOrder('${esc(o.id)}')">📷 Scan Gallons for this Order</button>
  </div>`;
  box.scrollIntoView({behavior:"smooth"});
}

function scanForOrder(id){
  activeOrderId = id;
  localStorage.setItem("staffActiveOrder", id);
  scanQR();
}

/* ================= SCAN QR ================= */
let stream = null, scanning = false, lastCode = "", lastTime = 0, rafId = null, detector = null;

function scanQR(){
  stopCamera();
  setActive("nav-scan");
  const orders = getOrders().filter(o => o.status !== "Cancelled" && o.status !== "Delivered");
  if (activeOrderId && !orders.some(o => o.id === activeOrderId)) activeOrderId = "";

  document.getElementById("content").innerHTML = `
  <div class="staff-qr-panel">
    <div class="staff-qr-step">🔰 Staff Verification</div>
    <h3><span style="color:#38bdf8;">▦</span> Scan Gallon QR Code</h3>
    <div class="staff-qr-subtitle">Scan the QR code attached to the gallon to record it for delivery.</div>
        <div class="viewfinder" id="viewfinder">
          <video id="video" playsinline muted></video>
          <div class="frame"></div><div class="laser"></div>
          <div class="placeholder"><span>▦</span>Camera is off.<br>Tap “Start Scanning” to scan.</div>
        </div>
        <canvas id="scanCanvas" style="display:none;"></canvas>
        <div id="scanResult" class="scan-result">Ready to scan a gallon QR code (e.g. <b>GAL-0042</b>).</div>
        <div class="staff-qr-tip">ⓘ After scanning, the gallon will be logged automatically for the selected order.</div>
        <div class="staff-qr-actions">
          <button class="btn green" id="camBtn" onclick="toggleCamera()">▣ Start Scanning</button>
          <button class="btn secondary" onclick="document.getElementById('qrFile').click()">▧ Scan from Image</button>
          <input type="file" id="qrFile" accept="image/*" style="display:none;" onchange="scanImageFile(this)">
        </div>
  </div>
  <br>
  <div class="scan-layout">
      <div class="card">
        <h3>🔗 Link to Order (optional)</h3>
        <br>
        <select class="select" id="orderSelect" style="width:100%;" onchange="setActiveOrder(this.value)">
          <option value="">— No order (just log scan) —</option>
          ${orders.map(o => `<option value="${esc(o.id)}" ${o.id===activeOrderId?"selected":""}>${esc(o.id)} · ${esc(o.customer)} · ${esc(o.gallons)} gal</option>`).join("")}
        </select>
        <div id="orderProgress"></div>
      </div>
      <div class="card">
        <br>
        <h3>⌨ Manual Entry</h3>
        <br>
        <div style="display:flex;gap:12px;">
          <input class="field" id="manualCode" placeholder="Type gallon code, e.g. GAL-0042" style="flex:1;"
                 onkeydown="if(event.key==='Enter'){handleCode(this.value);this.value='';}">
          <button class="btn" onclick="const i=document.getElementById('manualCode');handleCode(i.value);i.value='';">Add</button>
        </div>
        <br>
        <div class="notify">ⓘ Camera access needs HTTPS or localhost. If blocked, use manual entry or scan from an image.</div>
      </div>
  </div>
  <br>
  <div class="card">
    <h3>🕒 Recent Scans</h3>
    <br>
    <div class="table-wrap"><table>
      <thead><tr><th>Gallon</th><th>Order</th><th>Time</th></tr></thead>
      <tbody id="recentScans"></tbody>
    </table></div>
  </div>`;
  renderRecent();
  renderOrderProgress();
}

function setActiveOrder(id){
  activeOrderId = id;
  localStorage.setItem("staffActiveOrder", id);
  renderOrderProgress();
}

function renderOrderProgress(){
  const el = document.getElementById("orderProgress");
  if (!el) return;
  const o = getOrders().find(x => x.id === activeOrderId);
  if (!o){ el.innerHTML = ""; return; }
  const done = scannedFor(o.id).length;
  const pct = Math.min(100, Math.round(done / o.gallons * 100));
  el.innerHTML = `
    <br>
    <div class="notify">
      <b>${esc(o.customer)}</b> — ${done} / ${esc(o.gallons)} gallons scanned
      <div class="progress"><div style="width:${pct}%"></div></div>
      ${done >= o.gallons ? `<p style="margin-top:10px;">✅ All gallons for this order are scanned.</p>` : ""}
    </div>`;
}

function renderRecent(){
  const tbody = document.getElementById("recentScans");
  if (!tbody) return;
  const rows = scans.slice(-6).reverse();
  tbody.innerHTML = rows.length ? rows.map(s => `
    <tr><td>${esc(s.code)}</td><td>${esc(s.orderId || "—")}</td><td>${esc(s.time)}</td></tr>`).join("") :
    `<tr><td colspan="3" style="text-align:center;">No scans yet.</td></tr>`;
}

function showResult(type, html){
  const el = document.getElementById("scanResult");
  if (!el) return;
  el.className = "scan-result " + type;
  el.innerHTML = html;
}

function handleCode(raw){
  const code = String(raw || "").trim().toUpperCase();
  if (!code) return;

  if (!/^GAL-\d{1,6}$/.test(code)){
    showResult("err", `❌ Invalid QR: <b>${esc(code.slice(0,60))}</b><br>Expected a gallon code like GAL-0042.`);
    return;
  }
  if (scans.some(s => s.code === code && s.orderId === (activeOrderId || ""))){
    showResult("warn", `⚠ <b>${esc(code)}</b> was already scanned${activeOrderId ? " for " + esc(activeOrderId) : ""}.`);
    return;
  }
  const order = getOrders().find(o => o.id === activeOrderId);
  if (order && scannedFor(order.id).length >= order.gallons){
    showResult("warn", `⚠ ${esc(order.id)} already has all ${esc(order.gallons)} gallons scanned.`);
    return;
  }
  const now = new Date();
  scans.push({
    code,
    orderId: order ? order.id : "",
    time: now.toLocaleDateString() + " " + now.toLocaleTimeString(),
    staff: (load("currentUser", {}) || {}).username || "staff"
  });
  save("staffScans", scans);
  showResult("ok", `✅ <b>${esc(code)}</b> scanned${order ? " for <b>" + esc(order.id) + "</b>" : ""}.`);
  renderRecent();
  renderOrderProgress();
}

/* Camera */
async function toggleCamera(){
  if (scanning) stopCamera(); else await startCamera();
}
async function startCamera(){
  const vf = document.getElementById("viewfinder");
  const video = document.getElementById("video");
  const btn = document.getElementById("camBtn");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showResult("err","❌ Camera is not available in this browser or context (needs HTTPS/localhost).");
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
    video.srcObject = stream;
    await video.play();
    vf.classList.add("live");
    btn.textContent = "■ Stop Camera";
    btn.className = "btn red";
    scanning = true;
    if ("BarcodeDetector" in window){
      try { detector = new BarcodeDetector({formats:["qr_code"]}); } catch(e){ detector = null; }
    }
    showResult("", "📡 Point the camera at a gallon QR code...");
    tick();
  } catch(e){
    showResult("err","❌ Could not access camera. Allow permission or use manual entry.");
  }
}
function stopCamera(){
  scanning = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const vf = document.getElementById("viewfinder");
  const btn = document.getElementById("camBtn");
  if (vf) vf.classList.remove("live");
  if (btn){ btn.textContent = "▶ Start Camera"; btn.className = "btn green"; }
}
async function tick(){
  if (!scanning) return;
  const video = document.getElementById("video");
  if (video && video.readyState === video.HAVE_ENOUGH_DATA){
    let value = "";
    try{
      if (detector){
        const found = await detector.detect(video);
        if (found.length) value = found[0].rawValue;
      } else if (window.jsQR){
        const canvas = document.getElementById("scanCanvas");
        const ctx = canvas.getContext("2d", {willReadFrequently:true});
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const res = jsQR(img.data, img.width, img.height);
        if (res) value = res.data;
      }
    } catch(e){}
    const now = Date.now();
    if (value && (value !== lastCode || now - lastTime > 2500)){
      lastCode = value; lastTime = now;
      handleCode(value);
    }
  }
  rafId = requestAnimationFrame(tick);
}
function scanImageFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById("scanCanvas");
    const ctx = canvas.getContext("2d", {willReadFrequently:true});
    canvas.width = img.width; canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const res = window.jsQR ? jsQR(data.data, data.width, data.height) : null;
    if (res) handleCode(res.data);
    else showResult("err","❌ No QR code found in that image.");
    URL.revokeObjectURL(img.src);
    input.value = "";
  };
  img.src = URL.createObjectURL(file);
}

/* ================= SCAN HISTORY ================= */
function scanHistory(){
  stopCamera();
  setActive("nav-history");
  const rows = scans.slice().reverse();
  const today = new Date().toLocaleDateString();
  const todayCount = scans.filter(s => s.time.startsWith(today)).length;

  document.getElementById("content").innerHTML = `
  <div class="grid">
    <div class="card stat"><h2>${scans.length}</h2><p>Total Gallons Scanned</p></div>
    <div class="card stat"><h2>${todayCount}</h2><p>Scanned Today</p></div>
    <div class="card stat"><h2>${new Set(scans.map(s=>s.orderId).filter(Boolean)).size}</h2><p>Orders Verified</p></div>
  </div>
  <br>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h3>🧾 Scan History</h3>
      ${rows.length ? `<button class="btn red" onclick="clearScans()">🗑 Clear History</button>` : ""}
    </div>
    <br>
    <div class="table-wrap"><table>
      <thead><tr><th>Gallon</th><th>Order</th><th>Scanned By</th><th>Time</th></tr></thead>
      <tbody>
      ${rows.length ? rows.map(s => `
        <tr><td>${esc(s.code)}</td><td>${esc(s.orderId || "—")}</td><td>${esc(s.staff || "staff")}</td><td>${esc(s.time)}</td></tr>`).join("") :
        `<tr><td colspan="4" style="text-align:center;">No scans recorded yet.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
function clearScans(){
  if (!confirm("Clear all scan history?")) return;
  scans = [];
  save("staffScans", scans);
  scanHistory();
}

/* BUBBLES */
function createBubble(){
  const b = document.createElement("div");
  b.className = "bubble";
  const size = Math.random()*40 + 20;
  b.style.width = size + "px";
  b.style.height = size + "px";
  b.style.left = Math.random()*100 + "vw";
  b.style.top = Math.random()*100 + "vh";
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 15000);
}
setInterval(createBubble, 2000);
for (let i=0;i<8;i++) setTimeout(createBubble, Math.random()*5000);
