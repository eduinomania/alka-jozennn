 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OWNER DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI;
background:
linear-gradient(
135deg,
#0f4c75 0%,
#3282b8 25%,
#bbe1fa 50%,
#3282b8 75%,
#0f4c75 100%
);
background-size:400% 400%;
animation:waterFlow 20s ease infinite;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}

@keyframes waterFlow{
0%{background-position:0% 50%;}
25%{background-position:100% 50%;}
50%{background-position:100% 0%;}
75%{background-position:0% 0%;}
100%{background-position:0% 50%;}
}

/* BUBBLES */

.bubble{
position:fixed;
border-radius:50%;
background:linear-gradient(
135deg,
rgba(187,225,250,0.3),
rgba(50,130,184,0.2)
);
backdrop-filter:blur(15px);
border:2px solid rgba(187,225,250,0.4);
animation:waterDrop 15s infinite ease-in-out;
z-index:0;
}

@keyframes waterDrop{
0%{
transform:translateY(0) scale(1);
opacity:.7;
}
50%{
transform:translateY(-40px) scale(1.1);
opacity:1;
}
100%{
transform:translateY(0) scale(1);
opacity:.7;
}
}

/* SIDEBAR */

.sidebar{
width:260px;
height:100vh;
position:fixed;
padding:20px;
background:rgba(15,76,117,0.9);
backdrop-filter:blur(25px);
border-right:1px solid rgba(255,255,255,0.2);
z-index:10;
}

.brand{
font-size:24px;
font-weight:bold;
color:#bbe1fa;
text-align:center;
margin-bottom:30px;
}

.sidebar button{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:16px;
background:rgba(255,255,255,0.08);
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
text-align:left;
}

.sidebar button:hover{
background:rgba(255,255,255,0.18);
transform:translateX(5px);
}

.sidebar button.logout-btn{
margin-top:auto;
background:rgba(239,68,68,0.3);
border:1px solid rgba(239,68,68,0.5);
}

.sidebar button.logout-btn:hover{
background:rgba(239,68,68,0.5);
}

/* MAIN */

.main{
margin-left:260px;
padding:30px;
width:100%;
position:relative;
z-index:1;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.topbar h1{
font-size:32px;
color:#bbe1fa;
}

.clock{
padding:14px 20px;
border-radius:16px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:22px;
padding:25px;
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 30px rgba(0,0,0,0.2);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* STAT */

.stat{
text-align:center;
}

.stat h2{
font-size:40px;
color:#bbe1fa;
}

.stat p{
margin-top:10px;
color:#dbeafe;
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:16px;
}

th,td{
padding:16px;
text-align:left;
}

th{
background:rgba(15,76,117,0.5);
color:#bbe1fa;
}

tr{
background:rgba(255,255,255,0.05);
}

tr:hover{
background:rgba(255,255,255,0.1);
}

/* STATUS */

.status{
padding:8px 14px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.pending{
background:#f59e0b;
}

.delivered{
background:#22c55e;
}

.ontime{
background:#3b82f6;
}

/* NOTIFY */

.notify{
padding:18px;
margin:12px 0;
border-radius:14px;
background:rgba(255,255,255,0.08);
}

/* BUTTON */

.btn{
padding:12px 20px;
border:none;
border-radius:14px;
background:#3b82f6;
color:white;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* RESPONSIVE */

@media(max-width:768px){

body{
flex-direction:column;
}

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
}

}

/* CALENDAR */

.calendar{
width:100%;
}

.calendar-header{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-bottom:10px;
}

.calendar-header div{
background:rgba(255,255,255,0.08);
padding:12px;
text-align:center;
border-radius:12px;
font-weight:bold;
color:#bbe1fa;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
}

.day{
height:90px;
border-radius:16px;
padding:10px;
display:flex;
flex-direction:column;
justify-content:space-between;
font-weight:bold;
transition:.3s;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.day:hover{
transform:translateY(-3px);
background:rgba(255,255,255,0.1);
}

.day span{
font-weight:bold;
font-size:18px;
}

.day small{
font-size:11px;
margin-top:8px;
}

.attended{
border:2px solid #22c55e;
}

.late{
border:2px solid #f59e0b;
}

.empty{
background:transparent;
border:none;
}

/* ================= CALENDAR ================= */

.calendar-controls{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.calendar-controls h2{
font-size:32px;
font-weight:bold;
color:white;
}

.calendar-btn{
width:55px;
height:55px;
border:none;
border-radius:18px;
background:#3b82f6;
color:white;
font-size:22px;
cursor:pointer;
transition:.3s;
}

.calendar-btn:hover{
transform:scale(1.08);
background:#2563eb;
}

/* DAYS HEADER */

.calendar-header{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
margin-bottom:15px;
}

.calendar-header div{
text-align:center;
font-weight:bold;
padding:10px;
font-size:20px;
color:white;
}

/* GRID */

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:10px;
}

/* DAY BOX */

.day{
height:120px;
border-radius:20px;
padding:15px;
display:flex;
flex-direction:column;
justify-content:space-between;
font-weight:bold;
transition:.3s;
color:white;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.day:hover{
transform:translateY(-5px);
}

/* COLORS */

.presentDay{
background:#22c55e;
}

.lateDay{
background:#f59e0b;
}

.absentDay{
background:#ef4444;
}

.empty{
background:transparent;
box-shadow:none;
}

/* TEXT */

.day-number{
font-size:28px;
}

.time{
font-size:10px;
opacity:.95;
line-height:1.3;
}

.status-label{
font-size:10px;
padding:4px 8px;
border-radius:10px;
background:rgba(255,255,255,0.2);
width:fit-content;
}

/* RESPONSIVE */

@media(max-width:768px){

.calendar-grid{
grid-template-columns:repeat(2,1fr);
}

.calendar-header{
display:none;
}

.day{
height:110px;
}

}

.rider-card{
cursor:pointer;
transition:.3s;
}

.rider-card:hover{
transform:translateY(-5px) scale(1.02);
background:rgba(255,255,255,0.15);
}

/* ================= LOGIN OVERLAYS ================= */

.login-overlay {
position: fixed;
inset: 0;
background: linear-gradient(135deg, #0f4c75 0%, #3282b8 25%, #bbe1fa 50%, #3282b8 75%, #0f4c75 100%);
background-size: 400% 400%;
animation: waterFlow 20s ease infinite;
display: flex;
align-items: center;
justify-content: center;
z-index: 2000;
}

/* ================= ADMIN LOGIN ================= */

.admin-login-overlay {
position: fixed;
inset: 0;
padding: 12px;
overflow: auto;
background:
  radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px) 0 0 / 28px 28px,
  linear-gradient(160deg, #1a6fa8 0%, #2e8fc9 40%, #5ab4e0 100%);
display: flex;
align-items: center;
justify-content: center;
z-index: 2000;
}

.admin-login-shell {
width: 900px;
max-width: 95vw;
height: min(620px, calc(100vh - 24px));
display: flex;
border-radius: 24px;
overflow: hidden;
box-shadow: 0 30px 80px rgba(10, 60, 110, 0.45), 0 0 0 1px rgba(255,255,255,0.15);
animation: adminLoginPopIn 0.7s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes adminLoginPopIn {
from { transform: scale(0.92) translateY(20px); opacity: 0; }
to { transform: scale(1) translateY(0); opacity: 1; }
}

.admin-login-sidebar {
width: 200px;
flex-shrink: 0;
background: linear-gradient(180deg, #1565a0 0%, #1a6fa8 50%, #1e78b5 100%);
display: flex;
flex-direction: column;
align-items: center;
padding: 40px 20px;
position: relative;
overflow: hidden;
}

.admin-login-sidebar::before {
content: '';
position: absolute;
inset: 0;
background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 60%);
pointer-events: none;
}

.admin-login-brand-icon {
width: 60px;
height: 60px;
background: rgba(255,255,255,0.15);
border-radius: 18px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 14px;
border: 1px solid rgba(255,255,255,0.2);
box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.admin-login-brand-icon i {
font-size: 28px;
color: #7dd3fc;
filter: drop-shadow(0 0 8px rgba(125,211,252,0.6));
}

.admin-login-brand-name {
font: 800 18px 'Nunito', 'Segoe UI', sans-serif;
color: #fff;
text-align: center;
}

.admin-login-tagline {
font: 400 11px 'Nunito', 'Segoe UI', sans-serif;
color: rgba(255,255,255,0.65);
margin-top: 4px;
text-align: center;
}

.admin-login-nav {
margin-top: 40px;
width: 100%;
}

.admin-login-nav-item {
display: flex;
align-items: center;
gap: 10px;
padding: 11px 14px;
border-radius: 12px;
background: rgba(255,255,255,0.18);
color: #fff;
font: 600 13px 'Nunito', 'Segoe UI', sans-serif;
border: 1px solid rgba(255,255,255,0.2);
position: relative;
z-index: 1;
}

.admin-login-nav-item i { font-size: 14px; }

.admin-login-sidebar-toggle {
margin-top: auto;
width: 40px;
height: 40px;
border-radius: 50%;
background: rgba(255,255,255,0.12);
border: 1px solid rgba(255,255,255,0.2);
display: flex;
align-items: center;
justify-content: center;
color: rgba(255,255,255,0.7);
font-size: 16px;
}

.admin-login-main {
flex: 1;
min-width: 0;
background: rgba(180, 220, 240, 0.45);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
display: flex;
flex-direction: column;
}

.admin-login-topbar {
display: flex;
justify-content: space-between;
align-items: center;
padding: 18px 30px;
border-bottom: 1px solid rgba(255,255,255,0.3);
}

.admin-login-page-title {
font: 800 22px 'Nunito', 'Segoe UI', sans-serif;
color: rgba(255,255,255,0.9);
text-shadow: 0 1px 4px rgba(10,60,110,0.2);
}

.admin-login-clock {
background: rgba(255,255,255,0.3);
border: 1px solid rgba(255,255,255,0.4);
padding: 6px 14px;
border-radius: 20px;
font: 700 13px 'Nunito', 'Segoe UI', sans-serif;
color: rgba(255,255,255,0.95);
backdrop-filter: blur(10px);
}

.admin-login-form-area {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 20px 30px;
}

.admin-login-card {
position: relative;
z-index: 1;
background: rgba(255,255,255,0.35);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255,255,255,0.5);
border-radius: 20px;
padding: 28px 32px;
width: 100%;
max-width: 420px;
min-height: 500px;
max-height: 500px;
box-shadow: 0 8px 32px rgba(10,60,110,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
display: flex;
flex-direction: column;
justify-content: flex-start;
}

.admin-login-card h2 {
font: 800 22px 'Nunito', 'Segoe UI', sans-serif;
color: #0f3460;
text-align: center;
margin-bottom: 6px;
}

.admin-login-card p {
font: 600 12px 'Nunito', 'Segoe UI', sans-serif;
color: rgba(15,52,96,0.65);
text-align: center;
margin-bottom: 18px;
}

.admin-login-input-group { margin-bottom: 10px; }

.admin-login-input-box { position: relative; }

.admin-login-input-box i {
position: absolute;
left: 13px;
top: 50%;
transform: translateY(-50%);
color: #38bdf8;
font-size: 14px;
}

.admin-login-input-box input {
width: 100%;
padding: 14px 16px 14px 40px;
border: 1.5px solid rgba(255,255,255,0.7);
border-radius: 14px;
background: rgba(255,255,255,0.5);
outline: none;
font: 600 14px 'Nunito', 'Segoe UI', sans-serif;
color: #0f3460;
transition: 0.25s ease;
}

.admin-login-input-box input:focus {
border-color: rgba(14,165,233,0.75);
box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
}

.admin-login-input-box input::placeholder {
color: rgba(15,52,96,0.5);
font-weight: 600;
}

.admin-login-submit {
width: 100%;
padding: 12px;
margin-top: 4px;
border: 0;
border-radius: 12px;
background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 60%, #0284c7 100%);
color: #fff;
font: 800 14px 'Nunito', 'Segoe UI', sans-serif;
cursor: pointer;
box-shadow: 0 4px 15px rgba(56,189,248,0.4);
transition: 0.25s ease;
}

.admin-login-submit:hover {
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(56,189,248,0.5);
}

@media (max-width: 700px) {
  .admin-login-shell { height: min(620px, calc(100vh - 24px)); }
  .admin-login-sidebar { width: 72px; padding: 24px 12px; }
  .admin-login-brand-name, .admin-login-tagline, .admin-login-nav { display: none; }
  .admin-login-form-area { padding: 20px; }
  .admin-login-card { padding: 24px 20px; }
}

@media (max-height: 620px) {
  .admin-login-overlay { align-items: flex-start; }
  .admin-login-shell { height: auto; min-height: calc(100vh - 24px); }
  .admin-login-card { min-height: 450px; }
}

/* ================= CUSTOMER LOGIN ================= */

.customer-login-container {
display: none;
}

.customer-login-container.active {
display: flex;
}

.login-wrapper {
display: flex;
width: 100%;
height: 100vh;
}

.login-left {
width: 45%;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px;
background: rgba(15, 76, 117, 0.95);
backdrop-filter: blur(25px);
}

.login-brand {
text-align: center;
margin-bottom: 60px;
}

.water-icon {
width: 80px;
height: 80px;
background: rgba(187, 225, 250, 0.3);
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
margin: 0 auto 20px;
font-size: 50px;
}

.login-brand h1 {
font-size: 32px;
color: #bbe1fa;
margin: 0;
font-weight: bold;
}

.login-brand p {
font-size: 14px;
color: #a0d8ff;
margin-top: 5px;
}

.nav-buttons {
display: flex;
flex-direction: column;
gap: 12px;
width: 100%;
max-width: 300px;
margin-top: 40px;
}

.nav-btn {
padding: 14px 20px;
border: none;
border-radius: 12px;
background: rgba(255, 255, 255, 0.08);
color: white;
cursor: pointer;
font-size: 15px;
font-weight: 500;
transition: 0.3s;
text-align: center;
}

.nav-btn:hover {
background: rgba(255, 255, 255, 0.18);
}

.nav-btn.active {
background: rgba(187, 225, 250, 0.2);
border: 1px solid rgba(187, 225, 250, 0.4);
}

.nav-arrow {
position: absolute;
bottom: 40px;
right: 40px;
width: 50px;
height: 50px;
background: rgba(255, 255, 255, 0.1);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 20px;
transition: 0.3s;
}

.nav-arrow:hover {
background: rgba(255, 255, 255, 0.2);
transform: translateX(5px);
}

.login-right {
width: 55%;
display: flex;
align-items: center;
justify-content: center;
padding: 40px;
}

.login-form-container {
background: rgba(255, 255, 255, 0.95);
border-radius: 24px;
padding: 40px;
box-shadow: 0 24px 60px rgba(2, 44, 71, 0.25);
width: 100%;
max-width: 400px;
}

.login-form-container h2 {
color: #0f172a;
font-size: 24px;
margin-bottom: 8px;
}

.login-form-container p {
color: #64748b;
font-size: 14px;
margin-bottom: 28px;
}

.form-group {
margin-bottom: 16px;
}

.form-group label {
display: flex;
align-items: center;
color: #475569;
font-size: 13px;
margin-bottom: 6px;
}

.form-group label i {
margin-right: 6px;
font-size: 16px;
}

.form-group input {
width: 100%;
padding: 12px 14px;
border: 1px solid #bae6fd;
border-radius: 10px;
font-size: 15px;
transition: 0.3s;
}

.form-group input:focus {
outline: none;
border-color: #3b82f6;
box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.login-btn {
width: 100%;
padding: 12px;
background: #3b82f6;
color: white;
border: none;
border-radius: 10px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
margin-top: 10px;
transition: 0.3s;
}

.login-btn:hover {
background: #2563eb;
transform: translateY(-2px);
}

.login-links {
text-align: center;
margin-top: 20px;
font-size: 13px;
}

.login-links a {
color: #3b82f6;
text-decoration: none;
margin: 0 5px;
}

.login-links a:hover {
text-decoration: underline;
}

.close-login-btn {
position: absolute;
top: 20px;
right: 20px;
background: rgba(255, 255, 255, 0.1);
border: none;
color: white;
width: 40px;
height: 40px;
border-radius: 50%;
cursor: pointer;
font-size: 24px;
z-index: 2001;
}

.close-login-btn:hover {
background: rgba(255, 255, 255, 0.2);
}

/* RESPONSIVE */

@media(max-width:1024px){

.login-wrapper {
flex-direction: column;
height: auto;
}

.login-left {
width: 100%;
padding: 30px 20px;
}

.login-right {
width: 100%;
padding: 20px;
}

.login-form-container {
max-width: 100%;
}

}

</style>
</head>

<body>

<!-- ADMIN LOGIN OVERLAY -->
<div id="adminLoginOverlay" class="admin-login-overlay">
  <div class="admin-login-shell">
    <aside class="admin-login-sidebar">
      <div class="admin-login-brand-icon"><i class="fa-solid fa-droplet"></i></div>
      <div class="admin-login-brand-name">Alka-Jozen</div>
      <div class="admin-login-tagline">Pure Water Delivery</div>
      <div class="admin-login-nav">
        <div class="admin-login-nav-item"><i class="fa-solid fa-right-to-bracket"></i> Login</div>
      </div>
      <div class="admin-login-sidebar-toggle"><i class="fa-solid fa-chevron-right"></i></div>
    </aside>

    <main class="admin-login-main">
      <header class="admin-login-topbar">
        <div class="admin-login-page-title">Login</div>
        <div class="admin-login-clock" id="adminLoginClock">--:-- --</div>
      </header>

      <div class="admin-login-form-area">
        <section class="admin-login-card">
          <h2>Admin Access</h2>
          <p>Sign in to continue</p>
          <div class="admin-login-input-group">
            <div class="admin-login-input-box">
              <i class="fa-solid fa-user"></i>
              <input id="adminLoginUsername" type="text" placeholder="Username" autocomplete="username">
            </div>
          </div>
          <div class="admin-login-input-group">
            <div class="admin-login-input-box">
              <i class="fa-solid fa-lock"></i>
              <input id="adminLoginPassword" type="password" placeholder="Password" autocomplete="current-password">
            </div>
          </div>
          <button class="admin-login-submit" onclick="adminLogin()">Login</button>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="customerLoginOverlay" class="login-overlay customer-login-container">

function adminLogin() {
const enteredUser = document.getElementById("adminLoginUsername").value.trim();
const enteredPass = document.getElementById("adminLoginPassword").value.trim();

if (!enteredUser || !enteredPass) {
  alert("Please enter both the username and password.");
  return;
}

if (enteredUser === "admin" && enteredPass === "admin123") {
  localStorage.setItem("adminLoggedIn", "true");
  localStorage.setItem("userType", "admin");
  localStorage.setItem("currentUser", JSON.stringify({
    username: "admin",
    role: "admin",
    fname: "Admin"
  }));

  const overlay = document.getElementById("adminLoginOverlay");
  const sidebar = document.getElementById("sidebar");
  const main = document.getElementById("main");

  if (overlay) overlay.style.display = "none";
  if (sidebar) sidebar.style.display = "block";
  if (main) main.style.display = "block";
  
  salesReport();
} else {
  alert("Invalid admin credentials.");
}
}

function customerLogin() {
const username = document.getElementById("customerUsername").value.trim();
const password = document.getElementById("customerPassword").value.trim();

if (!username || !password) {
  alert("Please enter both username and password.");
  return;
}

// Demo: Accept any non-empty credentials
localStorage.setItem("customerLoggedIn", "true");
localStorage.setItem("userType", "customer");
localStorage.setItem("currentUser", JSON.stringify({
  username: username,
  role: "customer",
  fname: username
}));

alert("Welcome, " + username + "!");
// Could redirect to customer page
document.getElementById("customerLoginOverlay").classList.remove("active");
}

function logout() {
localStorage.removeItem("adminLoggedIn");
localStorage.removeItem("customerLoggedIn");
localStorage.removeItem("userType");
localStorage.removeItem("currentUser");

const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");
const overlay = document.getElementById("adminLoginOverlay");
const customerOverlay = document.getElementById("customerLoginOverlay");

if (sidebar) sidebar.style.display = "none";
if (main) main.style.display = "none";
if (overlay) overlay.style.display = "flex";
if (customerOverlay) customerOverlay.classList.remove("active");

// Clear inputs
document.getElementById("adminLoginUsername").value = "";
document.getElementById("adminLoginPassword").value = "";

function closeCustomerLogin() {
const overlay = document.getElementById("customerLoginOverlay");
if (overlay) overlay.classList.remove("active");
}

function switchLoginTab(tab) {
const buttons = document.querySelectorAll(".nav-btn");
buttons.forEach(btn => btn.classList.remove("active"));

function toggleLoginPanel() {

function ensureAdminLogin() {
const adminLoggedIn = localStorage.getItem("adminLoggedIn") === "true";
const overlay = document.getElementById("adminLoginOverlay");
const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");

if (!adminLoggedIn) {
  if (overlay) overlay.style.display = 'flex';
  if (sidebar) sidebar.style.display = 'none';
  if (main) main.style.display = 'none';
  return false;
}

if (overlay) overlay.style.display = 'none';
if (sidebar) sidebar.style.display = 'block';
if (main) main.style.display = 'block';

return true;
}

function openEmployeeForm(mode, id = null){

  modal.id = 'employeeFormModal';
  modal.className = 'popup-overlay';
  modal.style.display = 'flex';

  modal.innerHTML = `

function saveEmployeeAccount(id){
  const name = document.getElementById('empName').value.trim();
  const username = document.getElementById('empUsername').value.trim();
  const email = document.getElementById('empEmail').value.trim();
  const role = document.getElementById('empRole').value;
  const status = document.getElementById('empStatus').value;

  if (!name || !username || !email) {
    alert('Please complete all employee fields.');
    return;
  }

  const index = employeeAccounts.findIndex(emp => emp.id === id);

  if (index >= 0) {
    employeeAccounts[index] = { ...employeeAccounts[index], name, username, email, role, status };
  } else {
    employeeAccounts.push({ id: Date.now(), name, username, email, role, status });
  }

  saveEmployeeAccounts();
  closeEmployeeForm();
  employeeAccountsPage();
}

function toggleEmployeeStatus(id){
  const emp = employeeAccounts.find(item => item.id === id);
  if (!emp) return;

  emp.status = emp.status === 'Active' ? 'Deactivated' : 'Active';
  saveEmployeeAccounts();
  employeeAccountsPage();
}

/* ================= REAL CALENDAR ================= */

let currentMonth = 4;
let currentYear = 2026;

const months = [
"January","February","March","April",
"May","June","July","August",
"September","October","November","December"
];

/* SAMPLE ATTENDANCE */

const attendance = {
1:{status:"Present", in:"8:00 AM", out:"5:00 PM"},
2:{status:"Late", in:"8:45 AM", out:"5:15 PM"},
4:{status:"Absent"},
5:{status:"Present", in:"7:55 AM", out:"5:00 PM"},
7:{status:"Absent"},
8:{status:"Late", in:"8:30 AM", out:"5:05 PM"},
11:{status:"Absent"},
14:{status:"Absent"},
15:{status:"Late", in:"8:40 AM", out:"5:20 PM"},
17:{status:"Absent"},
21:{status:"Late", in:"8:50 AM", out:"5:15 PM"},
23:{status:"Absent"},
28:{status:"Absent"},
30:{status:"Absent"},
31:{status:"Absent"}
};

function generateCalendar(){
const grid = document.getElementById("calendarGrid");

if(!grid) return;

grid.innerHTML = "";

document.getElementById("monthTitle").innerHTML = `📅 ${months[currentMonth]} ${currentYear}`;

const firstDay = new Date(currentYear,currentMonth,1).getDay();
const totalDays = new Date(currentYear,currentMonth + 1,0).getDate();

for(let i=0;i<firstDay;i++){
grid.innerHTML += `<div class="day empty"></div>`;
}

for(let day=1; day<=totalDays; day++){
let data = attendance[day];
let className = "presentDay";
let content = "";

if(data){
if(data.status === "Late"){
className = "lateDay";
}
else if(data.status === "Absent"){
className = "absentDay";
}

content = `
<div class="day-number">${day}</div>
<div class="time">
${data.in ? `🕘 ${data.in}<br>` : ""}
${data.out ? `🕕 ${data.out}` : "No Attendance"}
</div>
<div class="status-label">${data.status}</div>
`;
}
else{
content = `
<div class="day-number">${day}</div>
<div class="time">🕘 8:00 AM<br>🕕 5:00 PM</div>
<div class="status-label">Present</div>
`;
}

grid.innerHTML += `<div class="day ${className}">${content}</div>`;
}
}

function prevMonth(){
currentMonth--;

if(currentMonth < 0){
currentMonth = 11;
currentYear--;
}

generateCalendar();
}

function nextMonth(){
currentMonth++;

if(currentMonth > 11){
currentMonth = 0;
currentYear++;
}

generateCalendar();
}

function generateRiderCalendar(){
const grid = document.getElementById("riderCalendarGrid");

if(!grid) return;

grid.innerHTML = "";

document.getElementById("riderMonthTitle").innerHTML = `📅 ${riderMonths[riderCurrentMonth]} ${riderCurrentYear}`;

const firstDay = new Date(riderCurrentYear, riderCurrentMonth, 1).getDay();
const totalDays = new Date(riderCurrentYear, riderCurrentMonth + 1, 0).getDate();

for(let i=0;i<firstDay;i++){
grid.innerHTML += `<div class="day empty"></div>`;
}

for(let day=1; day<=totalDays; day++){
let data = riderAttendance[day];
let className = "presentDay";
let content = "";

if(data){
if(data.status === "Late"){
className = "lateDay";
}
else if(data.status === "Absent"){
className = "absentDay";
}

content = `
<div class="day-number">${day}</div>
<div class="time">
${data.in ? `🕘 ${data.in}<br>` : ""}
${data.out ? `🕕 ${data.out}` : "No Attendance"}
</div>
<div class="status-label">${data.status}</div>
`;
}
else{
content = `
<div class="day-number">${day}</div>
<div class="time">🕘 8:00 AM<br>🕕 5:00 PM</div>
<div class="status-label">Present</div>
`;
}

grid.innerHTML += `<div class="day ${className}">${content}</div>`;
}
}

function prevRiderMonth(){
riderCurrentMonth--;

if(riderCurrentMonth < 0){
riderCurrentMonth = 11;
riderCurrentYear--;
}

generateRiderCalendar();
}

function nextRiderMonth(){
riderCurrentMonth++;

if(riderCurrentMonth > 11){
riderCurrentMonth = 0;
riderCurrentYear++;
}

generateRiderCalendar();
}
