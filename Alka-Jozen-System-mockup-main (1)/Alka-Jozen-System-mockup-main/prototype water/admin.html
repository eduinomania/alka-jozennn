<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI;
  background:
  linear-gradient(
      135deg,
      #0f4c75 0%,
      #3282b8 25%,
      #bbe1fa 50%,
      #3282b8 75%,
      #0f4c75 100%
  );
  background-size: 400% 400%;
  animation: waterFlow 20s ease infinite;
  color:white;
  display:flex;
  min-height: 100vh;
  overflow-x: hidden;
}

@keyframes waterFlow {
  0% { background-position: 0% 50%; }
  25% { background-position: 100% 50%; }
  50% { background-position: 100% 0%; }
  75% { background-position: 0% 0%; }
  100% { background-position: 0% 50%; }
}

/* WATER DROPLETS */

.bubble{
  position:fixed;
  border-radius:50%;
  background:linear-gradient(135deg, rgba(187, 225, 250, 0.3), rgba(50, 130, 184, 0.2));
  backdrop-filter: blur(15px);
  border: 2px solid rgba(187, 225, 250, 0.4);
  animation: waterDrop 15s infinite ease-in-out, ripple 3s infinite ease-in-out;
  z-index:0;
  box-shadow:
      0 8px 32px rgba(15, 76, 117, 0.2),
      inset 0 0 20px rgba(187, 225, 250, 0.1);
}

@keyframes waterDrop{
  0%{
      transform:translateY(0) rotate(0deg) scale(1);
      opacity: 0.7;
  }
  25%{
      transform:translateY(-40px) rotate(90deg) scale(1.1);
      opacity: 0.9;
  }
  50%{
      transform:translateY(-20px) rotate(180deg) scale(0.9);
      opacity: 0.8;
  }
  75%{
      transform:translateY(-50px) rotate(270deg) scale(1.2);
      opacity: 0.6;
  }
  100%{
      transform:translateY(0) rotate(360deg) scale(1);
      opacity: 0.7;
  }
}

@keyframes ripple {
  0%, 100% {
      transform: scale(1);
      box-shadow:
          0 8px 32px rgba(15, 76, 117, 0.2),
          inset 0 0 20px rgba(187, 225, 250, 0.1);
  }
  50% {
      transform: scale(1.05);
      box-shadow:
          0 12px 40px rgba(15, 76, 117, 0.3),
          inset 0 0 25px rgba(187, 225, 250, 0.15);
  }
}

/* SIDEBAR */

.sidebar{
  width:250px;
  height:100vh;
  background:
  linear-gradient(
      180deg,
      rgba(15, 76, 117, 0.9),
      rgba(50, 130, 184, 0.8),
      rgba(15, 76, 117, 0.9)
  );
  backdrop-filter: blur(25px);
  border-right: 2px solid rgba(187, 225, 250, 0.3);
  padding:20px;
  position:fixed;
  box-shadow:
  0 8px 32px rgba(15, 76, 117, 0.3),
  inset 0 0 50px rgba(187, 225, 250, 0.1);
}

.brand{
  font-size:24px;
  font-weight:bold;
  color:#bbe1fa;
  margin-bottom:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-shadow: 0 2px 10px rgba(187, 225, 250, 0.5);
}

.sidebar button{
  width:100%;
  padding:16px 18px;
  margin:10px 0;
  border:none;
  border-radius:16px;
  background:
  rgba(187, 225, 250, 0.1);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  color:#ffffff;
  cursor:pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-weight: 500;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(15, 76, 117, 0.1);
  text-align:left;
  font-size:15px;
}

.sidebar button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(187, 225, 250, 0.3), transparent);
  transition: left 0.5s;
}

.sidebar button:hover::before {
  left: 100%;
}

.sidebar button:hover{
  transform:translateX(8px) scale(1.02);
  background:
  rgba(187, 225, 250, 0.2);
  border-color: rgba(187, 225, 250, 0.4);
  box-shadow: 0 8px 25px rgba(15, 76, 117, 0.2);
}

/* MAIN */

.main{
  margin-left:250px;
  width:100%;
  padding:30px;
  position:relative;
  z-index:1;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.topbar h1{
  font-size:32px;
  font-weight:700;
  color:#bbe1fa;
  text-shadow: 0 2px 15px rgba(187, 225, 250, 0.5);
  margin:0;
}

.clock{
  background:
  rgba(187, 225, 250, 0.1);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  padding:15px 25px;
  border-radius:20px;
  color:#ffffff;
  font-weight:500;
  box-shadow: 0 8px 32px rgba(15, 76, 117, 0.2);
}
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

/* CARD */

.card{
  background:
  rgba(187, 225, 250, 0.1);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(187, 225, 250, 0.3);
  border-radius:24px;
  padding:30px;
  box-shadow:
  0 8px 32px rgba(15, 76, 117, 0.3),
  inset 0 0 50px rgba(187, 225, 250, 0.05);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative;
  overflow:hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(187, 225, 250, 0.2), transparent);
  transition: left 0.6s;
}

.card:hover::before {
  left: 100%;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:
  0 20px 60px rgba(15, 76, 117, 0.4),
  inset 0 0 60px rgba(187, 225, 250, 0.1);
}

/* STAT */

.stat{
  text-align:center;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative;
}

.stat:hover{
  transform:translateY(-10px) scale(1.05);
}

.stat h2{
  font-size:42px;
  font-weight:700;
  color:#bbe1fa;
  text-shadow: 0 2px 15px rgba(187, 225, 250, 0.5);
  margin:0;
}

.stat p{
  color:#94a3b8;
  font-size:16px;
  margin:10px 0 0 0;
  font-weight:500;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  background:
  rgba(187, 225, 250, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  border-radius:20px;
  overflow:hidden;
  box-shadow: 0 8px 32px rgba(15, 76, 117, 0.2);
}

th,td{
  padding:18px 20px;
  text-align:left;
  border-bottom: 1px solid rgba(187, 225, 250, 0.1);
}

th{
  background:
  rgba(15, 76, 117, 0.3);
  color:#bbe1fa;
  font-weight:600;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

tr{
  transition: all 0.3s ease;
}

tr:hover{
  background: rgba(187, 225, 250, 0.1);
  transform: scale(1.01);
}

td{
  color:#ffffff;
  font-size:15px;
}

/* STATUS */

.status{
  padding:8px 16px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  box-shadow: 0 2px 10px rgba(15, 76, 117, 0.1);
}

.pending{
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.8), rgba(217, 119, 6, 0.6));
  color:#ffffff;
}

.delivered{
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.8), rgba(22, 163, 74, 0.6));
  color:#ffffff;
}

.ontheway{
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(37, 99, 235, 0.6));
  color:#ffffff;
}

/* BUTTON */

.btn{
  padding:14px 24px;
  border:none;
  border-radius:16px;
  color:#ffffff;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative;
  overflow:hidden;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  box-shadow: 0 4px 15px rgba(15, 76, 117, 0.2);
  text-transform:uppercase;
  letter-spacing:0.5px;
}

.btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(187, 225, 250, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::before {
  left: 100%;
}

.btn:hover{
  transform:translateY(-2px) scale(1.05);
  box-shadow: 0 8px 25px rgba(15, 76, 117, 0.3);
}

.green{
  background: linear-gradient(135deg, #22c55e, #16a34a);
  border-color: rgba(34, 197, 94, 0.3);
}

.blue{
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border-color: rgba(59, 130, 246, 0.3);
}

.orange{
  background: linear-gradient(135deg, #f59e0b, #d97706);
  border-color: rgba(245, 158, 11, 0.3);
}

/* NOTIFICATIONS */

.notify{
  margin:15px 0;
  padding:20px;
  border-radius:16px;
  background:
  rgba(187, 225, 250, 0.1);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(187, 225, 250, 0.2);
  box-shadow: 0 4px 15px rgba(15, 76, 117, 0.1);
  transition: all 0.3s ease;
  color:#ffffff;
}

.notify:hover{
  transform:translateY(-3px);
  background:
  rgba(187, 225, 250, 0.15);
  box-shadow: 0 8px 25px rgba(15, 76, 117, 0.2);
}

/* RESPONSIVE */

@media(max-width:768px){

.sidebar{
  width:100%;
  height:auto;
  position:relative;
}

.main{
  margin-left:0;
}

body{
  flex-direction:column;
}

}

</style>
</head>

<script>

dashboard();

<span class="status ${

${order.status}

</span>

</table>

</div>

<br>

<!-- NOTIFICATIONS -->

<div class="card">

<h3>🔔 Notifications</h3>

<div class="notify">
📦 New order received
</div>

/* CHART */

function loadChart(){

new Chart(document.getElementById("salesChart"),{

type:'line',

data:{
labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],

datasets:[{
label:'Sales',
data:[120,190,300,250,400,280,500],
borderColor:'#38bdf8',
backgroundColor:'rgba(56,189,248,0.2)',
fill:true,
tension:.4
}]
},

options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'white'
}
}
},
scales:{
x:{
ticks:{color:'white'}
},
y:{
ticks:{color:'white'}
}
}
}

});

}

/* ORDERS */

function orders(){

let html = `
<div class="card">

html += `
<div class="card">
`;

// sample list (later pwede mo palitan ng localStorage orders)

Qty: 3 x 5-Gallon Jug · Method: GCash · Total: ₱18
<br>

`;

}

function approvePayment(){
alert("Payment Approved ✔");
orders();
}

function rejectPayment(){
alert("Payment Rejected ✖");
orders();
}
/* UPDATE STATUS */

function updateStatus(status){

order.status = status;

alert("Order updated to: " + status);

orders();

}

/* RIDERS */

function riders(){

document.getElementById("content").innerHTML = `

<div class="card">

<h2>🚴 Rider Panel</h2>

<br>

<p>🚴 Rider Name: ${order.rider}</p>

<br>

<br>

/* ANALYTICS */

function analytics(){

document.getElementById("content").innerHTML = `

<div class="grid">

<div class="card stat">

</script>

<script>
// WATER DROPLETS ANIMATION
function createBubble() {
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // Random size between 20-60px
  const size = Math.random() * 40 + 20;
  bubble.style.width = size + 'px';
  bubble.style.height = size + 'px';

  // Random position
  bubble.style.left = Math.random() * 100 + 'vw';
  bubble.style.top = Math.random() * 100 + 'vh';

  // Random animation delay
  bubble.style.animationDelay = Math.random() * 15 + 's';

  document.body.appendChild(bubble);

  // Remove bubble after animation
  setTimeout(() => {
    bubble.remove();
  }, 18000);
}

// Create bubbles every 2-4 seconds
setInterval(createBubble, Math.random() * 2000 + 2000);

// Initial bubbles
for(let i = 0; i < 8; i++) {
  setTimeout(createBubble, Math.random() * 5000);
}
</script>

</body>
</html>
